# The sources of "What an agent costs while it waits" (both languages): one entry
# per sentence that rests on a vendor's page or on one of the site's published
# articles, for the monthly source check. The factory's own numbers rest on the
# mayor's measurements and are not listed. Every quote was taken from its page
# on 2026-10-11.

- id: V1
  article: what-an-agent-costs-while-it-waits
  sentence:
    sv: "Enligt Claude Codes verktygsreferens har varje bevakning en tidsgräns på högst 30 minuter. Vid tidsgränsen upphör bevakningen och agenten får ett enda meddelande om det, så att den kan starta bevakningen igen."
    en: "According to Claude Code's tools reference, every watch has a deadline of at most 30 minutes. When it passes, the watch ends and the agent is told once, so that it can start the watch again."
  vendor: Anthropic
  url: https://code.claude.com/docs/en/tools-reference
  final_url: https://code.claude.com/docs/en/tools-reference
  quote: "Every watch Claude starts has a deadline: 5 minutes by default, at most 30 minutes … At the deadline the watch ends. Claude gets one notice, so it can start the watch again if it’s still needed."
  retrieved: 2026-10-11
  last_checked: 2026-10-11
- id: F1
  article: what-an-agent-costs-while-it-waits
  sentence:
    sv: "Varje anrop skickade hela kontexten till modellen igen, som En studie av borgmästarens kontext förklarar, så var och en av de omstarterna kostade dubbelt så många tokens som kontexten."
    en: "Each call sent the model the whole context again, as A study of the mayor's context explains, so each of those restarts cost twice the context in tokens."
  vendor: Addable Labs
  url: https://addablelabs.se/blog/what-the-mayors-context-costs/
  final_url: https://addablelabs.se/blog/what-the-mayors-context-costs/
  quote: "Every call sends the model the whole context."
  retrieved: 2026-10-11
  last_checked: 2026-10-11
- id: V2
  article: what-an-agent-costs-while-it-waits
  sentence:
    sv: "Borgmästarens schemalagda kontroller kostade på samma sätt: Claude Codes sida om att hantera kostnader påpekar att en schemalagd uppgift körs enligt sitt intervall även när sessionen är overksam och då skickar hela kontexten varje gång."
    en: "The mayor's scheduled checks cost the same way: Claude Code's page on managing costs notes that a scheduled task still runs while the session is idle, and that each run sends the whole context."
  vendor: Anthropic
  url: https://code.claude.com/docs/en/costs
  final_url: https://code.claude.com/docs/en/costs
  quote: "a scheduled task fires on its interval even while the session is idle, sending your full context each time"
  retrieved: 2026-10-11
  last_checked: 2026-10-11
- id: V3
  article: what-an-agent-costs-while-it-waits
  sentence:
    sv: "Ett meddelande i Slack som nämner ChatGPT kan starta en molnuppgift i Codex, som fortsätter att arbeta medan användarens dator sover."
    en: "A message in Slack that mentions ChatGPT can start a Codex cloud task, which keeps running while the user's computer sleeps."
  vendor: OpenAI
  url: https://learn.chatgpt.com/docs/cloud
  final_url: https://learn.chatgpt.com/docs/cloud
  quote: "Each task has its own workspace and can keep working while your computer is asleep."
  retrieved: 2026-10-11
  last_checked: 2026-10-11
# The Slack half of the same sentence: the article links this page from
