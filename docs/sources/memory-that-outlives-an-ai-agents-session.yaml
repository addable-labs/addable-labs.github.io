  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Copilot Memory tar underhållet från människorna. GitHubs dokumentation säger att det inte kräver något underhåll från dig, anpassar sig när kodbasen och dina vanor ändras och kastar bort det som slutar vara relevant. Det finns i alla betalda Copilot-planer och minnen som tas med i en modells kontext räknas in i tokenanvändningen. GitHubs tekniska inlägg redovisar en vinst i egna A/B-tester i januari 2026: för kodagenten 7 % högre andel sammanslagna pull requests, 90 % med minnen mot 83 % utan. Det är GitHubs siffror för den egna produkten och riskerna i föregående avsnitt följer med"
    en: "Copilot Memory takes the upkeep off people. GitHub's documentation says that it requires no maintenance from you, adapts as your codebase and your habits change and discards what stops being relevant. It is available on all paid Copilot plans, and memories included in a model's context count toward token usage. GitHub's engineering post reports a gain from its own A/B tests in January 2026: for the coding agent a 7% increase in pull request merge rates, 90% with memories against 83% without. Those are GitHub's figures for its own product, and the risks of the previous section come with it"
  vendor: GitHub
  url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  final_url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  quote: "Copilot Memory is available on all paid Copilot plans."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

