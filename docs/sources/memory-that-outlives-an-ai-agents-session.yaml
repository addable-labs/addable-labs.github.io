- id: M111
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Fabriken bakom den här sajten har sitt gemensamma tillstånd i Beads, en ärendehanterare med öppen källkod som i sin README kallar sig \"ett beständigt, strukturerat minne för agenter som kodar\" (vår översättning): en graf av uppgifter med beroenden i en versionshanterad databas, i stället för markdown-planer. En agent tar en bead, arbetar, skriver ner vad den gjorde och stänger den, som det beskrivs i Därför driver vi en agentdriven mjukvarufabrik. Om sessionen dör halvvägs förblir beaden öppen för nästa. Enligt README körs databasen som standard inuti en process med en enda writer, ett serverläge stöder flera writers och maskiner synkroniseras via git-remoten. bd remember sparar varaktiga projektfakta som bd prime läser in senare. Personliga preferenser lämnar README utanför: de hör hemma i ditt eget verktygs minne"
    en: "The factory behind this site keeps its shared state in Beads, an open-source tracker whose README calls it \"a persistent, structured memory for coding agents\": a graph of tasks with dependencies in a version-controlled database, in place of markdown plans. As Why we run an agent-run software factory describes, an agent claims a bead, works, writes down what it did and closes it. If its session dies halfway the bead stays open for the next one. According to the README the database runs inside one process with a single writer by default, a server mode serves several writers and machines sync through the git remote. bd remember stores durable project facts that bd prime injects later, and the README keeps personal preferences out: they belong in your own tool's memory"
  vendor: Beads (gastownhall)
  url: https://github.com/gastownhall/beads
  final_url: https://github.com/gastownhall/beads
  quote: "Beads provides a persistent, structured memory for coding agents. It replaces messy markdown plans with a dependency-aware graph"
  retrieved: 2026-11-21
  last_checked: 2026-11-22

