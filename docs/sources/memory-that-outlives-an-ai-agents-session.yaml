  url: https://code.claude.com/docs/en/github-actions
  final_url: https://code.claude.com/docs/en/github-actions
  quote: "Keep your CLAUDE.md concise, since Claude reads it on every run"
  retrieved: 2026-11-21
  last_checked: 2026-11-22

- id: M51
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Tre saker kan överleva ett jobb. De är inte likvärdiga. En commit kan granskas som vilken ändring som helst och finns där för nästa körning. En artifact är till för filer som ett jobb har skapat och som du vill använda eller titta på efter körningen. En cache är till för filer som är dyra att återskapa. Enligt GitHub ska ett jobb alltid kunna återskapa dem"
    en: "Three things can outlive a job, and they are not equal. A commit can be reviewed like any change and is there for the next run. An artifact is for files produced by a job that you want to use or view after the run has ended. A cache is for files that are expensive to regenerate, and GitHub says a job should always be able to regenerate them"
  vendor: GitHub
  url: https://docs.github.com/en/actions/concepts/workflows-and-actions/dependency-caching
  final_url: https://docs.github.com/en/actions/concepts/workflows-and-actions/dependency-caching
  quote: "Use artifacts when you want to save files produced by a job to use or view after a workflow run has ended"
  retrieved: 2026-11-21
  last_checked: 2026-11-22

- id: M52
  article: memory-that-outlives-an-ai-agents-session
  sentence:
