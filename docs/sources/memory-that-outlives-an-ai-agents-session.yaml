- id: M91
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Claude Codes automatiska minne kostar ingenting att köra. Claude Code undantar minnesmappen från rensningen som tar bort gamla sessionsutskrifter, så anteckningarna ligger kvar tills du eller Claude ändrar eller tar bort dem. Inget i det löper ut av sig självt – gallringen är din – och inget i det når en kollega eller en runner. Codex filer är genererat tillstånd: dokumentationen säger att man inte ska förlita sig på att redigera dem för hand och skrivbordsappen kan återställa en dators hela minnesförråd"
    en: "Claude Code's auto memory costs nothing to run. Claude Code excludes the memory folder from the sweep that deletes old session transcripts, so the notes stay until you or Claude edits or deletes them. Nothing in it expires on its own, which makes the pruning yours, and nothing in it reaches a colleague or a runner. Codex's files are generated state: its documentation says not to rely on editing them by hand, and the desktop app can reset a machine's whole memory store"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/memory
  final_url: https://code.claude.com/docs/en/memory
  quote: "Claude Code deletes old session transcripts after the cleanupPeriodDays retention period, but excludes the memory files in the memory directory from that retention sweep."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

