- id: M55
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Copilots cloud agent sparar det den lär sig utanför jobbet, i Copilot Memory, så att det finns kvar till nästa uppgift. I programmatiska sessioner med kommandoradsverktyget är minnet avstängt om inte körningen anger --enable-memory"
    en: "Copilot's cloud agent keeps what it learns outside the job, in Copilot Memory, so it is there for the next task. In programmatic sessions of the command-line tool, memory is off unless a run passes --enable-memory"
  vendor: GitHub
  url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  final_url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  quote: "For example, if Copilot cloud agent discovers how your repository handles database connections, Copilot code review can later apply that knowledge"
  retrieved: 2026-11-22
  last_checked: 2026-11-22

