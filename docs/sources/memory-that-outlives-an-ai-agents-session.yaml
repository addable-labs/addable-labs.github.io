- id: M65
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Leverantörernas kontroller riktar sig mot samma svaga punkter. Enligt GitHubs tekniska inlägg är den största oron minnen som är föråldrade, felaktiga eller till och med skrivna dit i ond avsikt. I sitt test la GitHub in vilseledande minnen i repona: fakta som motsade kodbasen, med källhänvisningar som pekade på irrelevant eller obefintlig kod. I alla testfall kontrollerade agenterna konsekvent källhänvisningarna, upptäckte motsägelserna och uppdaterade de felaktiga minnena. Det är GitHubs utvärdering av sin egen produkt. Den gäller minnen vars källhänvisningar inte stöder dem"
    en: "The vendors' controls aim at the same weak points. GitHub's engineering post names outdated, incorrect and even maliciously injected memories as its biggest concern. In its test it seeded repositories with adversarial memories: facts that contradicted the codebase, with citations pointing to irrelevant or nonexistent code. Across all test cases its agents consistently verified citations, discovered contradictions and updated the incorrect memories. That is GitHub's evaluation of its own product, and it covers memories whose citations do not support them"
  vendor: GitHub
  url: https://github.blog/ai-and-ml/github-copilot/building-an-agentic-memory-system-for-github-copilot/
  final_url: https://github.blog/ai-and-ml/github-copilot/building-an-agentic-memory-system-for-github-copilot/
  quote: "Our biggest concern was the impact of outdated, incorrect, or even maliciously injected memories."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

