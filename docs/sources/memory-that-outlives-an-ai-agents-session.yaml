- id: M34
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Skälet är vem som har kontrollerat texten. En människa skriver instruktionsfilen – den beskrivs i Instruktionsfilen, det första en AI-agent läser – och en kollega kan granska den i en pull request. En agent skriver minnet och ingen behöver ha läst det. GitHubs dokumentation ger ett andra skäl. Copilots kontroll av ett faktums källhänvisningar är Copilots eget omdöme och inte en garanti som systemet upprätthåller, så du bör inte lita på att ett lagrat faktum följs som en regel som alltid gäller"
    en: "The reason is who has checked the text. A person writes the instruction file, described in The instruction file, the first thing an AI agent reads, and a colleague can review it in a pull request. An agent writes the memory, and nobody has to have read it. GitHub's documentation gives a second reason: because Copilot's check of a fact's citations is a judgement it makes, rather than a guarantee enforced by the system, a stored fact should not be relied on as a rule that will always be followed"
  vendor: GitHub
  url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  final_url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  quote: "Because this is a judgment Copilot makes, rather than a guarantee enforced by the system, a stored fact should not be relied on as a rule that will always be followed."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

- id: M35
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Ett faktum flyttas från agentens anteckningar till filen när det har visat sig stabilt. VS Codes dokumentation beskriver stegen för repo-minne som har blivit stabilt och användbart för teamet. Kontrollera uppgiften mot repots kod och konfiguration, flytta den till projektdokumentet eller instruktionsfilen och granska ändringen i repots vanliga process. Uppdatera eller ta bort det lokala minnet efteråt för att undvika föråldrade eller motstridiga kopior"
    en: "A fact moves from the agent's notes to the file once it has proved stable. VS Code's documentation gives the steps for repository memory that has become stable and useful to the team. Verify the information against the repository's code and configuration, move it to the project document or instructions file and review the change through the repository's normal process. Then update or remove the local memory, to avoid stale or conflicting copies"
  vendor: Microsoft
  url: https://code.visualstudio.com/docs/agents/run/memory
  final_url: https://code.visualstudio.com/docs/agents/run/memory
  quote: "Verify the information against the repository's code and configuration."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

