- id: M121
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Behandla en runner som tom: allt ett jobb lär sig går förlorat om det inte checkas in och en cache är inget ställe att ha det på. Dela ett förråd mellan agenter bara där de måste se samma levande tillstånd och bestäm, innan du ansluter ett, vem som får skriva i det, vem som läser det och hur en post tas bort. Håll hemligheter utanför allt detta. Och kontrollera de aktuella inställningarna innan du förlitar dig på en standard, eftersom de i november 2026 skiljer sig mellan verktygen och mellan Copilots planer"
    en: "Treat a runner as empty: whatever a job learns is lost unless it is committed, and a cache is not a place to keep it. Share a store between agents only where they must see the same live state, and before you connect one, decide who may write to it, who reads it and how an entry is deleted. Keep secrets out of all of it. And check the current settings before you rely on a default, since in November 2026 they differ between the tools and between Copilot's plans"
  vendor: GitHub
  url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  final_url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  quote: "User-level preferences and repository-level facts have separate defaults."
  retrieved: 2026-11-21
  last_checked: 2026-11-21
