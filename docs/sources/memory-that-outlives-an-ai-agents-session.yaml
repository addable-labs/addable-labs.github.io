- id: M60
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "En preprint från Fudan University, publicerad i september 2026, prövar förgiftning på Claude Code självt. Den gömmer instruktioner i vanliga externa källor som text, bilder och PDF-filer, så att agenten skriver dem till sitt beständiga minne. De utlöses sedan i en senare session. Upplägget var en simulerad arbetsyta med e-post, kalender, delade dokument och formulär, där Claude Code kördes på tre språkmodeller från andra utvecklare. I genomsnitt nådde instruktionerna minnet i 66,9 % av försöken och ledde till ett läckage av privata data i en senare session i 81,7 % av testerna över sessioner. Det är medelvärden över en uppsättning tester, inte en andel för din egen konfiguration"
    en: "A preprint from Fudan University, posted in September 2026, tests poisoning on Claude Code itself. It hides instructions in ordinary external sources such as text, images and PDF files, so that the agent writes them to its persistent memory. They are then triggered in a later session. The setup was a simulated workspace of email, calendar, shared documents and forms, with Claude Code run on three language models from other developers. On average the instructions reached memory in 66.9% of the attempts and led to a leak of private data in a later session in 81.7% of the cross-session tests. These are averages over one set of tests, not a rate for your own setup"
  vendor: Fudan University (arXiv)
  url: https://arxiv.org/html/2609.13889v1
  final_url: https://arxiv.org/html/2609.13889v1
  quote: "PMPA embeds malicious instructions into benign external sources and induces the victim agent to write them into persistent memory"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

