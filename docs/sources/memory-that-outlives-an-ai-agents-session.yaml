- id: M68
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "GitHubs dokumentation tillägger att systemet kan avvisa minnen som innehåller kända modellstyrande tecken (model-control tokens), som ett skydd mot prompt injection. OpenAIs dokumentation beskriver en Codex-inställning, memories.disable_on_external_context, som håller chattar som har använt extern kontext, som MCP-verktygsanrop, webbsökning eller verktygssökning, utanför skapandet av minnen"
    en: "GitHub's documentation adds that its system can reject memories that contain recognised model-control tokens, as a defence against prompt injection. OpenAI's documentation describes a Codex setting, memories.disable_on_external_context, that keeps chats which used external context such as MCP tool calls, web search or tool search out of memory generation"
  vendor: GitHub
  url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  final_url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
