- id: M39
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "En tredje sorts text hör hemma i ingen av dem: pågående arbete. Matt Pocock, en praktiker, drar gränsen så här i sin guide till överlämning: \"Om du ständigt förklarar ett faktum på nytt hör det hemma i CLAUDE.md. En halvfärdig uppgift hör hemma i en överlämning.\" (vår översättning) Överlämningen är ämnet för artikeln om kontext"
    en: "A third kind of text belongs in neither: work in flight. Matt Pocock, a practitioner, puts the line this way in his handoff guide: \"If you keep re-explaining a fact, it belongs in CLAUDE.md. A half-finished task belongs in a handoff.\" The hand-off is the subject of the article on context"
  vendor: Matt Pocock
  url: https://github.com/mattpocock/skills/blob/main/docs/productivity/handoff.md
  final_url: https://github.com/mattpocock/skills/blob/main/docs/productivity/handoff.md
  quote: "If you keep re-explaining a fact, it belongs in CLAUDE.md. A half-finished task belongs in a handoff."
