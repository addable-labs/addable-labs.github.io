- id: M91
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Claude Codes auto memory kostar ingenting att köra. Claude Code lämnar minnesmappen utanför rensningen av gamla sessionstranskript, så anteckningarna ligger kvar tills du eller Claude ändrar eller tar bort dem. Inget av det löper ut av sig självt – det som rensas är det du eller Claude tar bort – och inget av det når en kollega eller en runner. Codex filer är genererat tillstånd (generated state): dokumentationen säger att du inte ska förlita dig på att redigera dem för hand. Desktop-appen kan nollställa hela minnesförrådet på en dator"
    en: "Claude Code's auto memory costs nothing to run. Claude Code excludes the memory folder from the sweep that deletes old session transcripts, so the notes stay until you or Claude edits or deletes them. Nothing in it expires on its own, so what is pruned is what you or Claude remove, and nothing in it reaches a colleague or a runner. Codex's files are generated state: its documentation says not to rely on editing them by hand, and the desktop app can reset a machine's whole memory store"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/memory
  final_url: https://code.claude.com/docs/en/memory
  quote: "Claude Code deletes old session transcripts after the cleanupPeriodDays retention period, but excludes the memory files in the memory directory from that retention sweep."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

