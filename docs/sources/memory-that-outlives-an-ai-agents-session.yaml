- id: M49
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Det som når runnern är det repo som ett steg i jobbet checkar ut. För Claude Codes GitHub Action är leverantörens svar den incheckade filen: dess dokumentation säger att man ska skapa en CLAUDE.md i repots rot för kodstil, granskningskriterier, projektspecifika regler och föredragna mönster och hålla den kortfattad, eftersom Claude läser den vid varje körning"
