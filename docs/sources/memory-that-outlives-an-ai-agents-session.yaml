- id: M118
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Läs det din agent redan har sparat: /memory i Claude Code, repots Copilot-minnesinställningar på GitHub och mappen ~/.codex för Codex. Sortera sedan det du hittar i tre sorter: regler, sådant man vill komma ihåg och pågående arbete. Det som alltid måste gälla hör hemma i den incheckade instruktionsfilen, granskad som kod. Ett faktum som har visat sig stabilt flyttas dit från minnet och anteckningen tas bort. Pågående arbete hör hemma i en överlämning"
    en: "Read what your agent has already saved: /memory in Claude Code, the repository's Copilot memory settings on GitHub and the ~/.codex folder for Codex. Then sort what you find into three kinds of text: rules, recall and work in flight. What must always hold goes in the committed instruction file, reviewed like code. A fact that has proved stable moves there from memory, and the note is deleted. Work in flight goes in a hand-off"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/memory
  final_url: https://code.claude.com/docs/en/memory
  quote: "The /memory command lists your CLAUDE.md, CLAUDE.local.md, and other memory file locations across user and project scopes."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

