- id: M77
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Den tystare risken är ett faktum som var sant när det skrevs. Fabriken bakom den här sajten stötte på den i september 2026. I En studie av borgmästarens kontext hoppade nya sessioner över det mesta av en anteckningslogg som hade blivit för lång att läsa i sin helhet och tog gamla fakta för aktuella. Lägeskortet som skrivs om vid varje överlämning och referensen som läses i ett anrop fanns redan. Ändringen var att korta båda och sätta tak för dem, som \"Vad som fyller en AI-agents kontext\" beskriver. Pococks ordlista beskriver det allmänna fallet: ett faktum som antecknades i mars läses in med samma tillförsikt i juni – efter att projektet har gått vidare – och ett minnessystem behöver rensas på samma sätt som AGENTS.md"
    en: "The quieter risk is a fact that was true when it was written. The factory behind this site met it in September 2026. In A study of the mayor's context, a notes log that had become too long to read whole was mostly skipped by new sessions, which took old facts as current. The state card rewritten at every hand-off and the reference read in one call were already in place; the change, described in \"What fills an AI agent's context\", was to trim and cap both. Pocock's dictionary states the general case: a fact recorded in March is loaded with equal confidence in June, after the project has moved on, and a memory system needs pruning, the same way AGENTS.md does"
  vendor: Addable Labs
  url: https://addablelabs.se/blog/what-the-mayors-context-costs/
  final_url: https://addablelabs.se/blog/what-the-mayors-context-costs/
  quote: "A notes log too long to read whole: sessions skipped most of it and took old facts as current"
  retrieved: 2026-11-21
  last_checked: 2026-11-22

