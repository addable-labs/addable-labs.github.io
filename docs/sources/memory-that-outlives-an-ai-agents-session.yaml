- id: M118
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Ett första steg är att läsa det din agent redan har sparat: /memory i Claude Code, repots Copilot-minnesinställningar på GitHub och mappen ~/.codex för Codex. Det du hittar går att sortera i tre sorter: regler, sådant du vill komma ihåg och pågående arbete. Regler som teamet förlitar sig på hör hemma i instruktionsfilen i repot, där de granskas som kod. En regel som måste gälla oavsett vad agenten bestämmer behöver dessutom en gräns utanför modellen. Pågående arbete hör hemma i en överlämning"
    en: "A first step is to read what the agent has already saved: /memory in Claude Code, the repository's Copilot memory settings on GitHub and the ~/.codex folder for Codex. What you find sorts into three kinds of text: rules, recall and work in flight. Rules the team relies on go in the committed instruction file, reviewed like code, and one that must hold whatever the agent decides also needs a limit outside the model. Work in flight goes in a hand-off"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/memory
  final_url: https://code.claude.com/docs/en/memory
  quote: "The /memory command lists your CLAUDE.md, CLAUDE.local.md, and other memory file locations across user and project scopes."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

