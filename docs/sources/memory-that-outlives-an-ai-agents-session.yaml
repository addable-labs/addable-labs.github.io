- id: M47
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Ett jobb på en GitHub-värdad runner börjar i ett rent tillstånd. GitHubs dokumentation säger att varje GitHub-värdad runner – med undantag för enkärniga runners – är en ny virtuell maskin och dess sida om beroendecachning säger att jobb på GitHub-värdade runners startar i en ren runner-avbild. En anteckning som agenten skriver under ett jobb är därför borta när jobbet slutar, om inte jobbet checkar in den, laddar upp den eller cachar den"
    en: "A job on a GitHub-hosted runner begins in a clean state. GitHub's documentation says that, with the exception of single-CPU runners, each GitHub-hosted runner is a new virtual machine, and its page on dependency caching says that jobs on GitHub-hosted runners start in a clean runner image. A note the agent writes during a job is therefore gone when the job ends, unless the job commits it, uploads it or caches it"
  vendor: GitHub
  url: https://docs.github.com/en/actions/concepts/runners/github-hosted-runners
  final_url: https://docs.github.com/en/actions/concepts/runners/github-hosted-runners
  quote: "With the exception of single-CPU runners, each GitHub-hosted runner is a new virtual machine (VM) hosted by GitHub."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

