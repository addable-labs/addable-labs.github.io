- id: M95
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "En minnesserver är en MCP-server: ett program som agenten anropar för att läsa och skriva minnen i ett förråd som flera agenter eller verktyg kan dela. Att ansluta en är det förtroendebeslut som del 5 beskriver, med ett tillägg: det den innehåller har skrivits av agenter och läses av agenter. Ingenting läser in den i början av sig självt. Agenten måste anropa den och därför ger referensserverns README en exempelprompt som börjar varje chatt med att hämta all relevant information ur kunskapsgrafen"
    en: "A memory server is an MCP server: a program the agent calls to read and write memories in a store that several agents or tools can share. Connecting one is the trust decision that part 5 describes, with one addition: what it holds was written by agents and is read by agents. Nothing loads it at the start by itself. The agent has to call it, which is why the reference server's README gives an example prompt that begins every chat by retrieving all relevant information from the knowledge graph"
  vendor: Model Context Protocol (reference servers)
  url: https://github.com/modelcontextprotocol/servers/tree/main/src/memory
  final_url: https://github.com/modelcontextprotocol/servers/tree/main/src/memory
  quote: "Always begin your chat by saying only \"Remembering...\" and retrieve all relevant information from your knowledge graph"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: M96
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Referensservern i Model Context Protocol-projektets repo beskriver sig själv som \"en grundläggande implementation av beständigt minne med en lokal kunskapsgraf\" (vår översättning). Den lagrar grafen i en fil, så det finns inget att drifta. Flera klienter på en dator kan dela filen, eftersom varje skrivning tar ett lås, men README säger att ett nätverksfilsystem som inte respekterar låset inte kan delas säkert på det här sättet och att ingenting som standard sätter tak för grafen. Repot kallar sina servrar referensimplementationer och inte produktionsfärdiga lösningar"
    en: "The reference server in the Model Context Protocol project's repository describes itself as \"a basic implementation of persistent memory using a local knowledge graph\". It keeps the graph in one file, so there is nothing to host. Several clients on one computer can share the file, because every write takes a lock, but the README says that a network file system that does not honour the lock cannot be shared safely this way and that by default nothing caps the graph. The repository calls its servers reference implementations and not production-ready solutions"
  vendor: Model Context Protocol (reference servers)
  url: https://github.com/modelcontextprotocol/servers/tree/main/src/memory
  final_url: https://github.com/modelcontextprotocol/servers/tree/main/src/memory
  quote: "A basic implementation of persistent memory using a local knowledge graph."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

