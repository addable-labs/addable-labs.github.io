- id: M25
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "I Codex skapas minnet av tidigare chattar i stället för att skrivas under dem. OpenAIs dokumentation säger att Codex gör om användbar kontext från lämpliga tidigare chattar till lokala minnesfiler, hoppar över aktiva eller kortvariga sessioner och maskerar hemligheter i de genererade fälten. Den uppdaterar minnen i bakgrunden, när en chatt har varit overksam tillräckligt länge, i stället för vid slutet av varje chatt"
    en: "In Codex, memory is generated from earlier chats instead of being written during them. OpenAI's documentation says that Codex turns useful context from eligible prior chats into local memory files, skips active or short-lived sessions and redacts secrets from the generated fields. It updates memories in the background, once a chat has been idle long enough, instead of at the end of every chat"
  vendor: OpenAI
  url: https://learn.chatgpt.com/docs/customization/memories
  final_url: https://learn.chatgpt.com/docs/customization/memories
  quote: "After you enable memories, Codex can turn useful context from eligible prior chats into local memory files. Codex skips active or short-lived sessions, redacts secrets from generated memory fields, and updates memories in the background instead of immediately at the end of every chat."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

