- id: M101
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "basic-memory (AGPL-3.0) lagrar anteckningar som markdown-filer som både människor och modeller läser och skriver, med ett lokalt SQLite-index och utan krav på servrar. Self-hosted är det gratis och synkroniseringen mellan enheter görs manuellt, till exempel med Git eller Syncthing. Projektets molntjänst kostar i november 2026 15,00 dollar i månaden till ett betapris – ordinarie pris är 19 dollar. Team workspace har samma prissättning: en användare till att börja med och fler efter behov. Enligt projektet blir allt en teammedlem skriver direkt tillgängligt för alla andra och deras AI-assistenter. En felaktig post når dem lika snabbt som en riktig"
    en: "basic-memory (AGPL-3.0) keeps notes as Markdown files that people and models both read and write, with a local SQLite index and no servers required. Self-hosted it is free and syncing between devices is manual, with Git or Syncthing for instance. In November 2026 its hosted service costs $15.00 a month at a beta price, against a regular price of $19. Its team workspace has the same pricing, starting with one user and adding more as needed. Anything a teammate writes, it says, is immediately available to everyone else and to their AI assistants. A wrong entry reaches them as fast as a right one"
  vendor: Basic Machines (basic-memory)
  url: https://github.com/basicmachines-co/basic-memory
  final_url: https://github.com/basicmachines-co/basic-memory
  quote: "structured Markdown files that humans and LLMs both read and write"
  retrieved: 2026-11-21
  last_checked: 2026-11-22

