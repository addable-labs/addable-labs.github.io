    en: "Claude Code has two things that carry knowledge across sessions: CLAUDE.md files, which you write, and auto memory, which Claude writes itself from your corrections and preferences"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/memory
  final_url: https://code.claude.com/docs/en/memory
  quote: "instructions you write to give Claude persistent context"
