- id: M74
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Ett minne är en vanlig fil som agenten skriver och som andra ofta kan läsa, så en hemlighet som hamnar i ett följer med. GitHubs dokumentation säger att minnen kontrolleras för hemligheter som tokens, nycklar eller inloggningsuppgifter och att ett minne där en sådan upptäcks avvisas. OpenAIs dokumentation säger att Codex maskerar hemligheter i genererade minnesfält men att du ändå bör granska filerna innan du delar din Codex-hemkatalog. VS Codes dokumentation säger tydligt att man inte ska lagra inloggningsuppgifter, hemligheter eller känslig personlig information i minnet. Del 5 håller en token utanför filer och chatt och del 7 visar en regel mot att läsa en .env-fil; minnet kräver samma försiktighet"
    en: "A memory is a plain file that the agent writes and other people can often read, so a secret that lands in one travels with it. GitHub's documentation says that memories are checked for secrets such as tokens, keys or credentials and that a memory in which one is detected is rejected. OpenAI's documentation says that Codex redacts secrets from generated memory fields but that you should still review the files before sharing your Codex home directory. VS Code's documentation says plainly not to store credentials, secrets or sensitive personal information in memory. Part 5 keeps a token out of files and chat, and part 7 shows a rule against reading a .env file; memory needs the same care"
  vendor: GitHub
  url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  final_url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  quote: "Memories are checked for secrets, such as tokens, keys, or credentials. Memories in which a secret is detected are rejected and are not stored."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

