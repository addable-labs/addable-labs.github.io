- id: M02
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Anthropics guide till kontextteknik definierar tekniken i två halvor: agenten skriver anteckningar utanför kontextfönstret och anteckningarna läses in i kontextfönstret igen vid senare tillfällen"
    en: "Anthropic's guide to context engineering defines the technique in two halves: the agent writes notes outside the context window, and those notes get pulled back into the context window at later times"
  vendor: Anthropic
  url: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
  final_url: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
  quote: "Structured note-taking, or agentic memory, is a technique where the agent regularly writes notes persisted to memory outside of the context window. These notes get pulled back into the context window at later times."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: M03
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "En praktikers ordlista, Matt Pococks AI Hero dictionary, ger halvorna namn. På skrivvägen sparar agenten det den lärde sig under en session som filer i miljön. På läsvägen läser verktyget in de filerna, eller ett register över dem, i kontextfönstret i början av en senare session"
    en: "A practitioner's glossary, Matt Pocock's AI Hero dictionary, names the halves. On the write path the agent records what it learned during a session as files in the environment. On the read path the tool loads those files, or an index of them, back into the context window at the start of a later session"
  vendor: Matt Pocock
  url: https://www.aihero.dev/ai-coding-dictionary/memory-system
  final_url: https://www.aihero.dev/ai-coding-dictionary/memory-system
  quote: "The write path: during a session, the agent records what it learned — a preference you stated, a fact about the project — as files in the environment. The read path: at session start, the harness loads those files, or an index of them, back into the context window."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: M04
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Det som läses in igen hamnar i startinnehållet och tar därför plats i varje anrop. Det är kontext och inget mer. Claude Codes dokumentation säger att den behandlar CLAUDE.md-filer och automatiskt minne som kontext och inte som påtvingad konfiguration. För att blockera en åtgärd oavsett vad Claude bestämmer pekar den på en hook. Vad som påtvingas utanför modellen är ämnet för Sätt gränserna i förväg"
    en: "What is read back lands in the start-up content and so takes room in every request. It is context and nothing more. Claude Code's documentation says that it treats CLAUDE.md files and auto memory as context and not as enforced configuration. To block an action whatever Claude decides, it points to a hook. What is enforced outside the model is the subject of Set the limits in advance"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/memory
  final_url: https://code.claude.com/docs/en/memory
  quote: "Claude treats CLAUDE.md files and auto memory as context. They aren't enforced configuration. To block an action regardless of what Claude decides, use a PreToolUse hook instead."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

