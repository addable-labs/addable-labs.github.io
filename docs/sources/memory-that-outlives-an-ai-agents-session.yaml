- id: M30
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Alla tre leverantörerna drar gränsen på samma ställe. OpenAIs dokumentation säger att du ska lägga obligatoriska riktlinjer för teamet i AGENTS.md eller i dokumentation i repot och behandla minnen som \"ett användbart lager för att komma ihåg, inte som den enda källan till regler som alltid måste gälla\" (vår översättning). VS Codes dokumentation påpekar att repo-fakta delas och inte är privata anteckningar. Den säger också att du ska lägga granskade krav för teamet i projektdokumentation under versionshantering eller i custom instructions"
    en: "All three vendors draw the line in the same place. OpenAI's documentation says to keep required team guidance in AGENTS.md or checked-in documentation and to treat memories as \"a helpful recall layer, not as the only source for rules that must always apply\". VS Code's documentation notes that repository facts are shared and not private notes, and says to keep reviewed team requirements in source-controlled project documentation or custom instructions"
  vendor: OpenAI
  url: https://learn.chatgpt.com/docs/customization/memories
  final_url: https://learn.chatgpt.com/docs/customization/memories
  quote: "Keep required team guidance in AGENTS.md or checked-in documentation. Treat memories as a helpful recall layer, not as the only source for rules that must always apply."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

