- id: M57
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "I Copilot skapas repo-fakta bara när Copilot arbetar i ett repo där användaren har skrivrättigheter. Appen och det interaktiva kommandoradsverktyget kan be dig godkänna ett minne innan det lagras men molnagenten och kodgranskningen frågar inte. GitHubs dokumentation tillägger att repo-fakta kan fångas ur pull requests som stängdes utan att slås ihop och att Copilot ska kontrollera dem mot den aktuella kodbasen, vilket inte garanterar att den känner igen varje föråldrat faktum"
    en: "In Copilot, repository facts are created only when Copilot works in a repository where the user has write access. The app and the interactive command-line tool can ask you to approve a memory before it is stored, but the cloud agent and code review do not ask. GitHub's documentation adds that repository facts can be captured from pull requests that were closed without merging, and that Copilot is told to check them against the current codebase, which does not guarantee that it recognises every outdated fact"
  vendor: GitHub
  url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  final_url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  quote: "Repository-level facts are only created when Copilot is working in a repository you have write access to"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

