- id: M60
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "En instruktion som har gömts i ett dokument kan hamna i agentens minne och göra skada flera sessioner senare. En preprint från forskare vid University of Auckland och Fudan University, publicerad i september 2026, testar det på själva Claude Code. Metoden är att gömma instruktioner i vanliga externa källor – text, bilder och PDF-filer – så att agenten skriver dem till sitt beständiga minne. De utlöses sedan i en senare session. Upplägget var en simulerad arbetsyta med e-post, kalender, delade dokument och formulär, där Claude Code kördes på tre språkmodeller från andra utvecklare. I genomsnitt nådde instruktionerna minnet i 66,9 % av försöken. I 81,7 % av testerna som gick över flera sessioner ledde de till att privata data läckte i en senare session. Det är medelvärden över en uppsättning tester, inte en andel för din egen konfiguration"
    en: "A preprint by researchers at the University of Auckland and Fudan University, posted in September 2026, tests poisoning on Claude Code itself. The method is to hide instructions in ordinary external sources such as text, images and PDF files, so that the agent writes them to its persistent memory. They are then triggered in a later session. The setup was a simulated workspace of email, calendar, shared documents and forms, with Claude Code run on three language models from other developers. On average the instructions reached memory in 66.9% of the attempts. In 81.7% of the cross-session tests they led to a leak of private data in a later session. These are averages over one set of tests, not a rate for your own setup"
  vendor: "University of Auckland and Fudan University (arXiv)"
  url: https://arxiv.org/html/2609.13889v1
  final_url: https://arxiv.org/html/2609.13889v1
  quote: "PMPA embeds malicious instructions into benign external sources and induces the victim agent to write them into persistent memory"
  retrieved: 2026-11-21
  last_checked: 2026-11-22

