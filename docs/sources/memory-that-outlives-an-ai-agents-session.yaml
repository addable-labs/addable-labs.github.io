- id: M34
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Orsaken är vem som har kontrollerat texten. En människa skriver instruktionsfilen – den beskrivs i Instruktionsfilen, det första en AI-agent läser – och en kollega kan granska den i en pull request. En agent skriver minnet och ingen behöver ha läst det. GitHubs dokumentation är tydlig med följden: eftersom Copilots kontroll av ett faktums källhänvisningar är ett omdöme som Copilot gör och inte en garanti som systemet upprätthåller bör man inte lita på att ett lagrat faktum följs som en regel som alltid gäller"
    en: "The reason is who has checked the text. A person writes the instruction file, described in The instruction file, the first thing an AI agent reads, and a colleague can review it in a pull request. An agent writes the memory, and nobody has to have read it. GitHub's documentation is plain about the consequence: because Copilot's check of a fact's citations is a judgement it makes, rather than a guarantee enforced by the system, a stored fact should not be relied on as a rule that will always be followed"
  vendor: GitHub
  url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  final_url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  quote: "Because this is a judgment Copilot makes, rather than a guarantee enforced by the system, a stored fact should not be relied on as a rule that will always be followed."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: M35
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "I figuren flyttar ett faktum från agentens anteckningar till filen när det har visat sig stabilt. VS Codes dokumentation ger stegen för repo-minne som har blivit stabilt och användbart för teamet: kontrollera uppgiften mot repots kod och konfiguration, flytta den till projektdokumentet eller instruktionsfilen, granska ändringen i repots vanliga process och uppdatera eller ta bort det lokala minnet för att undvika föråldrade eller motstridiga kopior"
    en: "In the figure a fact moves from the agent's notes to the file once it has proved stable. VS Code's documentation gives the steps for repository memory that has become stable and useful to the team: verify the information against the repository's code and configuration, move it to the project document or instructions file, review the change through the repository's normal process and update or remove the local memory to avoid stale or conflicting copies"
  vendor: Microsoft
  url: https://code.visualstudio.com/docs/agents/run/memory
  final_url: https://code.visualstudio.com/docs/agents/run/memory
  quote: "Verify the information against the repository's code and configuration."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

