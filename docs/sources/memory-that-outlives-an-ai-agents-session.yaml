- id: M87
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Med Copilot Memory slipper människor underhållet. Enligt GitHubs dokumentation kräver det inget underhåll från dig, anpassar sig när kodbasen och dina vanor ändras och kastar bort det som slutar vara relevant. Det finns i alla betalda Copilot-abonnemang. Minnen som tas med i modellens kontext räknas med i tokenanvändningen. GitHubs tekniska inlägg från januari 2026 redovisar en förbättring i egna A/B-tester. För det som inlägget kallar coding agent ökade andelen mergade pull requests med 7 %: 90 % med minnen mot 83 % utan. Det är GitHubs siffror för deras egen produkt. Riskerna ovan följer med"
    en: "Copilot Memory takes the upkeep off people. GitHub's documentation says that it requires no maintenance from you, adapts as your codebase and your habits change and discards what stops being relevant. It is available on all paid Copilot plans, and memories included in a model's context count toward token usage. GitHub's engineering post of January 2026 reports a gain from its own A/B tests: for the coding agent, as the post calls it, a 7% increase in pull request merge rates, 90% with memories against 83% without. Those are GitHub's figures for its own product, and the risks above come with it"
  vendor: GitHub
  url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  final_url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  quote: "It requires no maintenance from you, it adapts as your codebase and your habits change, and it discards what stops being relevant."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

