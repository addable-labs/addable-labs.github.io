- id: M51
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "I figuren kan tre saker överleva ett jobb och de är inte likvärdiga. En incheckning kan granskas som vilken ändring som helst och finns där för nästa körning. En artefakt är till för filer som ett jobb har skapat och som du vill använda eller titta på sedan körningen har tagit slut. En cache är till för filer som är dyra att återskapa och GitHub säger att ett jobb alltid ska kunna återskapa dem"
    en: "In the figure, three things can outlive a job, and they are not equal. A commit can be reviewed like any change and is there for the next run. An artifact is for files produced by a job that you want to use or view after the run has ended. A cache is for files that are expensive to regenerate, and GitHub says a job should always be able to regenerate them"
  vendor: GitHub
  url: https://docs.github.com/en/actions/concepts/workflows-and-actions/dependency-caching
  final_url: https://docs.github.com/en/actions/concepts/workflows-and-actions/dependency-caching
