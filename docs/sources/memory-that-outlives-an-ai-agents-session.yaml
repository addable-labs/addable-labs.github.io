  sentence:
    sv: "Det som når runnern är repot som ett steg i jobbet checkar ut. För Claude Codes GitHub Action är leverantörens svar filen i repot. Action-dokumentationen säger att du ska skapa en CLAUDE.md i repots rot för kodstil, granskningskriterier, projektspecifika regler och föredragna mönster – och hålla den kortfattad, eftersom Claude läser den vid varje körning"
