- id: M39
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "En tredje sorts text hör hemma i ingen av dem: pågående arbete. Pocock drar gränsen så här i sin guide till överlämning: \"Om du ständigt förklarar ett faktum på nytt hör det hemma i CLAUDE.md. En halvfärdig uppgift hör hemma i en överlämning.\" (vår översättning) Överlämningen beskrivs i \"Vad som fyller en AI-agents kontext\""
    en: "A third kind of text belongs in neither: work in flight. Pocock's handoff guide puts the line this way: \"If you keep re-explaining a fact, it belongs in CLAUDE.md. A half-finished task belongs in a handoff.\" The hand-off is the subject of \"What fills an AI agent's context\""
  vendor: Matt Pocock
  url: https://github.com/mattpocock/skills/blob/main/docs/productivity/handoff.md
  final_url: https://github.com/mattpocock/skills/blob/main/docs/productivity/handoff.md
  quote: "If you keep re-explaining a fact, it belongs in CLAUDE.md. A half-finished task belongs in a handoff."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

- id: M40
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Claude Codes auto memory ligger lokalt på varje dator: alla worktrees för ett repo delar en mapp och filerna delas inte mellan datorer eller molnmiljöer. Det som följer med repot är det som committas: projektets CLAUDE.md – som delas med teamet via versionshantering – och scope project för en subagents eget minne. Dokumentationen om subagenter rekommenderar det som standard eftersom kunskapen då går att dela via versionshantering"
    en: "Claude Code's auto memory is machine-local: all worktrees of a repository share one folder, and the files are not shared across machines or cloud environments. What travels with the repository is what is committed: the project CLAUDE.md, shared with the team through version control, and the project scope of a subagent's own memory, which the documentation on subagents recommends as the default because it makes the knowledge shareable through version control"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/memory
  final_url: https://code.claude.com/docs/en/memory
  quote: "Auto memory is machine-local. All worktrees and subdirectories within the same git repository share one auto memory directory. Files are not shared across machines or cloud environments."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

