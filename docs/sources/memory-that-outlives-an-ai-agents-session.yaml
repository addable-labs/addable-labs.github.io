- id: M53
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "En cache är ett dåligt ställe att ha ett minne på. Enligt GitHubs dokumentation återställer varje körning som kan läsa en cache innehållet precis som det är. Återställda filer ska därför behandlas som opålitlig indata och hemligheter ska inte lagras i en cache. En förgiftad cache kan leda till att kod körs i betrodda workflows. En minnesfil är till för att agenten ska följa den, vilket är raka motsatsen till opålitlig indata"
    en: "A cache is a poor place to keep a memory. Any run that can read a cache restores its contents as they are, GitHub's documentation says. Restored files should therefore be treated as untrusted input and no secrets should be stored in a cache. Poisoned caches can lead to code execution in trusted workflows. A memory file is meant to be followed by the agent, which is the opposite of untrusted input"
  vendor: GitHub
  url: https://docs.github.com/en/actions/concepts/workflows-and-actions/dependency-caching
  final_url: https://docs.github.com/en/actions/concepts/workflows-and-actions/dependency-caching
  quote: "Any run that can read a cache restores its contents as-is, so you should treat restored files as untrusted input and never store secrets or other sensitive data in a cache."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

