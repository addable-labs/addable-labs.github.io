- id: M80
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Verktygen har en del av den gallringen inbyggd. Claude Code påminner agenten – när MEMORY.md närmar sig sin gräns – att ha en rad per post och slå ihop eller ta bort föråldrade poster. Den noterar också när varje minne skrevs, så att ett faktums ålder syns. GitHub låter minnen löpa ut efter en period utan förstärkning och Copilot kan rösta ned ett minne som den bedömer som felaktigt eller föråldrat"
    en: "The tools build in some of that pruning. Claude Code reminds the agent, when MEMORY.md nears its limit, to keep one line per entry and to merge or drop stale entries, and it records when each memory was written so that the age of a fact is visible. GitHub lets memories expire after a period without reinforcement, and Copilot can downvote a memory it finds wrong or outdated"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/memory
  final_url: https://code.claude.com/docs/en/memory
  quote: "If the file is near a limit, Claude Code reminds Claude to shorten it: keep one line per entry, move detail into topic files, and merge or drop stale entries."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

