- id: M80
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Verktygen har en del av den rensningen inbyggd. När MEMORY.md närmar sig sin gräns påminner Claude Code agenten om att ha en rad per post och att slå ihop eller ta bort föråldrade poster. Claude Code antecknar också när varje minne skrevs, så att ett faktums ålder syns. I GitHub kan ett minne löpa ut om det inte har förstärkts under en period, alltså om Copilot inte har röstat upp det. Copilot kan också rösta ned ett minne som den bedömer är felaktigt eller föråldrat"
    en: "The tools build in some of that pruning. Claude Code reminds the agent, when MEMORY.md nears its limit, to keep one line per entry and to merge or drop stale entries, and it records when each memory was written so that the age of a fact is visible. GitHub lets memories expire after a period without reinforcement, meaning that Copilot has not upvoted them. Copilot can also downvote a memory it finds wrong or outdated"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/memory
  final_url: https://code.claude.com/docs/en/memory
  quote: "If the file is near a limit, Claude Code reminds Claude to shorten it: keep one line per entry, move detail into topic files, and merge or drop stale entries."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

