- id: M70
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "De enklaste kontrollerna är de två allmänna lärdomarna som en säkerhetsforskare drar i en genomgång från 2025 av minnet i en AI-agent för kodning: system bör föreslå minnen för användaren i stället för att lägga till dem automatiskt och användare bör granska minnen regelbundet. Att granska minnen går att göra i alla tre verktygen. Claude Codes auto memory är vanlig markdown som du öppnar med /memory. Codex minnesfiler går att granska i hemkatalogen. GitHub låter personer med rätt behörighet granska och ta bort repo-fakta i repots inställningar"
    en: "A security researcher's two general lessons from a 2025 write-up on a coding agent's memory are the simplest controls: systems should suggest memories to the user rather than adding them automatically, and users should inspect memories regularly. The second is possible in all three tools: Claude Code's auto memory is plain markdown that /memory opens, Codex's memory files can be inspected in its home directory and GitHub lets people with the right access review and delete repository facts in the repository's settings"
  vendor: Johann Rehberger
  url: https://embracethered.com/blog/posts/2025/windsurf-spaiware-exploit-persistent-prompt-injection/
  final_url: https://embracethered.com/blog/posts/2025/windsurf-spaiware-exploit-persistent-prompt-injection/
  quote: "Systems should suggest memories to the user, rather than automatically adding them."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

