- id: M74
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Ett minne är text som agenten skriver och som andra ofta kan läsa. En hemlighet som hamnar i ett minne följer därför med. GitHubs dokumentation säger att minnen skannas efter hemligheter som tokens, nycklar eller inloggningsuppgifter och att ett minne där en sådan hittas avvisas. OpenAIs dokumentation säger att Codex maskerar hemligheter i genererade minnesfält, men att du ändå bör granska filerna innan du delar din Codex-hemkatalog. VS Codes dokumentation säger tydligt att du inte ska lagra inloggningsuppgifter, hemligheter eller känslig personlig information i minnet. Samma försiktighet gäller för minnet som i de tidigare delarna: i \"MCP, så når AI-agenten andra system\" hålls en token utanför filer och chatt och i \"Sätt gränserna i förväg\" finns en regel mot att läsa en .env-fil"
    en: "A memory is text that the agent writes and that other people can often read, so a secret that lands in one travels with it. GitHub's documentation says that memories are checked for secrets such as tokens, keys or credentials and that a memory in which one is detected is rejected. OpenAI's documentation says that Codex redacts secrets from generated memory fields but that you should still review the files before sharing your Codex home directory. VS Code's documentation says plainly not to store credentials, secrets or sensitive personal information in memory. \"MCP, how an AI agent reaches other systems\" keeps a token out of files and chat. \"Set the limits in advance\" shows a rule against reading a .env file. Memory needs the same care"
  vendor: GitHub
  url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  final_url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  quote: "Memories are checked for secrets, such as tokens, keys, or credentials. Memories in which a secret is detected are rejected and are not stored."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

