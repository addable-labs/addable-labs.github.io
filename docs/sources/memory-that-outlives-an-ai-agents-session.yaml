- id: M95
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "En minnesserver är en MCP-server: ett program som agenten anropar för att läsa och skriva minnen i ett minnesförråd som flera agenter eller verktyg kan dela. Att ansluta en är samma förtroendebeslut som i \"MCP, så når AI-agenten andra system\", med ett tillägg: det den innehåller har skrivits av agenter och läses av agenter. Ingenting läser in den automatiskt i början. Agenten måste anropa den. Referensserverns README innehåller en exempelprompt för personanpassning. Den säger åt agenten att börja varje chatt med att hämta all relevant information ur kunskapsgrafen"
    en: "A memory server is an MCP server: a program the agent calls to read and write memories in a store that several agents or tools can share. Connecting one is the trust decision that \"MCP, how an AI agent reaches other systems\" describes, with one addition: what it holds was written by agents and is read by agents. Nothing loads it at the start by itself. The agent has to call it, and the reference server's README gives an example prompt, for chat personalisation, that begins every chat by retrieving all relevant information from the knowledge graph"
  vendor: Model Context Protocol (reference servers)
  url: https://github.com/modelcontextprotocol/servers/tree/main/src/memory
  final_url: https://github.com/modelcontextprotocol/servers/tree/main/src/memory
  quote: "Always begin your chat by saying only \"Remembering...\" and retrieve all relevant information from your knowledge graph"
