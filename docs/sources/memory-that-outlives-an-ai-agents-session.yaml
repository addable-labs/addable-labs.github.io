- id: M70
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "En säkerhetsforskares två allmänna lärdomar från en genomgång 2025 av en kodagents minne är de enklaste kontrollerna: system bör föreslå minnen för användaren i stället för att lägga till dem automatiskt och användare bör granska minnen regelbundet. Det andra går att göra i alla verktygen ovan: Claude Codes automatiska minne är vanlig markdown som /memory öppnar och GitHub låter personer med rätt behörighet granska och ta bort repo-fakta i repots inställningar"
    en: "A security researcher's two general lessons from a 2025 write-up on a coding agent's memory are the simplest controls: systems should suggest memories to the user rather than adding them automatically, and users should inspect memories regularly. The second is possible in all the tools above: Claude Code's auto memory is plain markdown that /memory opens, and GitHub lets people with the right access review and delete repository facts in the repository's settings"
  vendor: Johann Rehberger
