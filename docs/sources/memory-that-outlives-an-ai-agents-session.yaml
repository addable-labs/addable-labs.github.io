- id: M32
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "GitHub beskriver en arbetsfördelning: custom instructions för viktiga regler – som ett säkerhetskrav eller ett obligatoriskt granskningssteg – och Copilot Memory för detaljerna som samlas på hög och annars skulle göra en instruktionsfil lång och svår att underhålla. På Claude Codes sida är uppdelningen efter syfte: CLAUDE.md-filer styr Claudes beteende och auto memory låter Claude lära sig av dina korrigeringar"
    en: "GitHub's documentation describes a division of labour: use custom instructions for important rules, such as a security requirement or a mandatory review step, and let Copilot Memory handle the accumulated detail that would otherwise make an instructions file long and hard to maintain. Claude Code's page sorts the two by purpose: CLAUDE.md files to guide Claude's behaviour, auto memory to let Claude learn from your corrections"
  vendor: GitHub
  url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  final_url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  quote: "Use custom instructions to state important rules, such as a security requirement or a mandatory review step, and let Copilot Memory handle the accumulated detail that would otherwise make an instructions file long and hard to maintain."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

