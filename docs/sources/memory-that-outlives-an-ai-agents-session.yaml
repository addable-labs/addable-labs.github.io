- id: M84
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Filen i repot behöver ingen tjänst och når varje dator och runner precis som den är. Svagheten är densamma som i \"Instruktionsfilen, det första en AI-agent läser\": en lång fil följs sämre. Claude Code har /doctor prompt-audit, som letar efter instruktioner skrivna för äldre modeller, hänvisningar till filer eller kommandon som inte finns och filer som motsäger varandra. Kostnaden är tiden det tar för människor att hålla filen sann"
    en: "The committed file needs no service, and it reaches every computer and runner as it is. Its weakness is the one \"The instruction file, the first thing an AI agent reads\" describes: a long file is followed less closely. Claude Code offers /doctor prompt-audit, which looks for instructions written for older models, references to files or commands that do not exist and files that contradict each other. The cost is people's time to keep the file true"
  vendor: Addable Labs
  url: https://addablelabs.se/blog/the-instruction-file/
  final_url: https://addablelabs.se/blog/the-instruction-file/
  quote: "The file is short on purpose. A long file takes up more of the room the agent has to work in and is followed less closely."
  retrieved: 2026-11-22
  last_checked: 2026-11-22

