- id: M121
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "En runner är tom när jobbet börjar: allt ett jobb lär sig går förlorat om det inte pushas i en commit eller sparas i ett minnesförråd utanför runnern – och en cache är inget ställe att ha det på. Innan du ansluter ett delat minnesförråd, till exempel en minnesserver, är det bra att ha bestämt vem som får skriva i det, vem som läser det och hur en post tas bort. Det är också värt att kontrollera de aktuella inställningarna innan du förlitar dig på en standard, eftersom de i november 2026 skiljer sig mellan verktygen och mellan Copilots abonnemang"
    en: "A runner is empty when the job starts: whatever a job learns is lost unless it is pushed in a commit or kept in a store outside the runner, and a cache is not a place to keep it. Before a shared store such as a memory server is connected, it helps to have decided who may write to it, who reads it and how an entry is deleted. It is also worth checking the current settings before relying on a default, since in November 2026 they differ between the tools and between Copilot's plans"
  vendor: GitHub
  url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  final_url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  quote: "User-level preferences and repository-level facts have separate defaults."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

