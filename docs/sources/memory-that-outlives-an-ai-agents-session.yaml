- id: M01
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Claude Codes dokumentation säger det rakt ut: varje session börjar med ett nytt kontextfönster"
    en: "Claude Code's documentation puts the starting point plainly: each session begins with a fresh context window"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/memory
  final_url: https://code.claude.com/docs/en/memory
  quote: "Each Claude Code session begins with a fresh context window."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

- id: M02
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Anthropics guide till context engineering kallar tekniken agentic memory eller structured note-taking. Det går ut på två saker. Agenten skriver anteckningar utanför kontextfönstret. Senare läses de in i kontextfönstret igen"
    en: "Anthropic's guide to context engineering calls the technique agentic memory, or structured note-taking, and defines it in two halves: the agent writes notes outside the context window, and those notes get pulled back into the context window at later times"
  vendor: Anthropic
  url: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
  final_url: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
  quote: "Structured note-taking, or agentic memory, is a technique where the agent regularly writes notes persisted to memory outside of the context window. These notes get pulled back into the context window at later times."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

- id: M03
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Utvecklaren Matt Pococks ordlista, AI Hero dictionary, ger de två sakerna namn. På write path sparar agenten det den lärde sig under en session som filer i miljön. På read path läser verktyget i början av en senare session in de filerna, eller ett index över dem, i kontextfönstret"
    en: "A practitioner's glossary, Matt Pocock's AI Hero dictionary, names the halves. On the write path the agent records what it learned during a session as files in the environment. On the read path the tool loads those files, or an index of them, back into the context window at the start of a later session"
  vendor: Matt Pocock
  url: https://www.aihero.dev/ai-coding-dictionary/memory-system
  final_url: https://www.aihero.dev/ai-coding-dictionary/memory-system
  quote: "The write path: during a session, the agent records what it learned — a preference you stated, a fact about the project — as files in the environment. The read path: at session start, the harness loads those files, or an index of them, back into the context window."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

- id: M04
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Det som läses in igen i början hamnar i startinnehållet och tar därför upp en del av kontextfönstret i varje anrop. Det är kontext och ingenting annat. Enligt Claude Codes dokumentation behandlar Claude CLAUDE.md-filer och auto memory som kontext. De är inte konfiguration som verktyget upprätthåller. För att blockera en åtgärd oavsett vad Claude bestämmer pekar dokumentationen på en hook. Det som upprätthålls utanför modellen beskrivs i Sätt gränserna i förväg"
    en: "What is read back at the start lands in the start-up content and so takes up part of the context window in every request. It is context and nothing more. Claude Code's documentation says that Claude treats CLAUDE.md files and auto memory as context and not as enforced configuration. To block an action whatever Claude decides, it points to a hook. What is enforced outside the model is the subject of Set the limits in advance"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/memory
  final_url: https://code.claude.com/docs/en/memory
  quote: "Claude treats CLAUDE.md files and auto memory as context. They aren't enforced configuration. To block an action regardless of what Claude decides, use a PreToolUse hook instead."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

