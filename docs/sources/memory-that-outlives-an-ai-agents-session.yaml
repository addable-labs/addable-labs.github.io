- id: M47
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "En anteckning som agenten skriver under ett jobb är borta när jobbet slutar, om inte jobbet pushar den i en commit, laddar upp den som en artifact eller cachar den. Ett jobb på en GitHub-hosted runner börjar i ett rent tillstånd: GitHubs dokumentation säger att varje GitHub-hosted runner – med undantag för single-CPU-runners – är en ny virtuell maskin. Sidan om dependency caching säger att jobb på GitHub-hosted runners startar från en ren runner image"
    en: "A note the agent writes during a job is gone when the job ends, unless the job pushes it in a commit, uploads it as an artifact or caches it. A job on a GitHub-hosted runner begins in a clean state: GitHub's documentation says that, with the exception of single-CPU runners, each GitHub-hosted runner is a new virtual machine, and its page on dependency caching says that jobs on GitHub-hosted runners start in a clean runner image"
  vendor: GitHub
  url: https://docs.github.com/en/actions/concepts/runners/github-hosted-runners
  final_url: https://docs.github.com/en/actions/concepts/runners/github-hosted-runners
  quote: "With the exception of single-CPU runners, each GitHub-hosted runner is a new virtual machine (VM) hosted by GitHub."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

