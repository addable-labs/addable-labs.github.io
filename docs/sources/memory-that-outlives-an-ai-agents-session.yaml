  last_checked: 2026-11-21

- id: M40
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Claude Codes automatiska minne är maskinlokalt: alla worktrees för ett repo delar en mapp och filerna delas inte mellan datorer eller molnmiljöer. Det som följer med repot är det som checkas in: projektets CLAUDE.md – som delas med teamet via versionshantering – och omfånget project i en subagents eget minne, som dokumentationen rekommenderar som standard eftersom det gör kunskapen delbar via versionshantering"
    en: "Claude Code's auto memory is machine-local: all worktrees of a repository share one folder, and the files are not shared across machines or cloud environments. What travels with the repository is what is committed: the project CLAUDE.md, shared with the team through version control, and the project scope of a subagent's own memory, which the documentation recommends as the default because it makes the knowledge shareable through version control"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/memory
  final_url: https://code.claude.com/docs/en/memory
  quote: "Auto memory is machine-local. All worktrees and subdirectories within the same git repository share one auto memory directory. Files are not shared across machines or cloud environments."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

