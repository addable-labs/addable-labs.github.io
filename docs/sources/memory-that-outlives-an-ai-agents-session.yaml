- id: M84
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Den incheckade filen behöver ingen tjänst och den når varje dator och runner som den är. Dess svaghet är den som varje delat dokument har: den växer tills agenten följer den sämre. Claude Codes dokumentation siktar på under 200 rader per fil eftersom längre filer tar mer kontext och minskar följsamheten. Den erbjuder /doctor prompt-audit, som letar efter instruktioner skrivna för äldre modeller, hänvisningar till filer eller kommandon som inte finns och filer som motsäger varandra. Kostnaden är människors tid för att hålla filen sann"
    en: "The committed file needs no service, and it reaches every computer and runner as it is. Its weakness is the one every shared document has: it grows until the agent follows it less well. Claude Code's documentation targets under 200 lines per file, since longer files consume more context and reduce adherence. It offers /doctor prompt-audit, which looks for instructions written for older models, references to files or commands that do not exist and files that contradict each other. The cost is people's time to keep the file true"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/memory
  final_url: https://code.claude.com/docs/en/memory
  quote: "target under 200 lines per CLAUDE.md file. Longer files consume more context and reduce adherence."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

