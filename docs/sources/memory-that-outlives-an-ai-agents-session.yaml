- id: M64
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Författarna prövade också ett försvar på promptnivå, som minskade minnesinjektionen i många konfigurationer men gav begränsat skydd när minnet väl hade förgiftats. En förgiftad instruktion stoppas bara om något utanför modellen stoppar den. Därför spelar gränserna i del 7 större roll med minne, inte mindre. I figuren ligger det förgiftade kortet i förrådet och läses i början av varje senare session. Det kortet ber om stoppas bara av en gräns som sitter efter agenten"
    en: "The authors also tested one prompt-level defence, which reduced memory injection in many settings but gave limited protection once the memory had been poisoned. A poisoned instruction is stopped only if something outside the model stops it. That is why the limits of part 7 matter more with memory, not less. In the figure the poisoned card sits in the store and is read at the start of every later session. Only a limit placed after the agent stops what the card asks for"
  vendor: Fudan University (arXiv)
  url: https://arxiv.org/html/2609.13889v1
  final_url: https://arxiv.org/html/2609.13889v1
  quote: "provides limited protection once the persistent memory has been poisoned"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: M65
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Leverantörernas kontroller riktar sig mot samma svaga punkter. GitHubs tekniska inlägg nämner föråldrade, felaktiga och till och med illasinnat inmatade minnen som sin största oro. I testet sådde man repon med motstridiga minnen – fakta som stred mot kodbasen, med källhänvisningar som pekade på irrelevant eller obefintlig kod – och i alla testfall kontrollerade agenterna konsekvent källhänvisningarna, upptäckte motsägelserna och uppdaterade de felaktiga minnena. Det är GitHubs utvärdering av dess egen produkt och den gäller minnen vars källhänvisningar inte stöder dem"
    en: "The vendors' controls aim at the same weak points. GitHub's engineering post names outdated, incorrect and even maliciously injected memories as its biggest concern. In its test it seeded repositories with adversarial memories, facts that contradicted the codebase with citations pointing to irrelevant or nonexistent code, and across all test cases its agents consistently verified citations, discovered contradictions and updated the incorrect memories. That is GitHub's evaluation of its own product, and it covers memories whose citations do not support them"
  vendor: GitHub
  url: https://github.blog/ai-and-ml/github-copilot/building-an-agentic-memory-system-for-github-copilot/
  final_url: https://github.blog/ai-and-ml/github-copilot/building-an-agentic-memory-system-for-github-copilot/
  quote: "Our biggest concern was the impact of outdated, incorrect, or even maliciously injected memories."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

