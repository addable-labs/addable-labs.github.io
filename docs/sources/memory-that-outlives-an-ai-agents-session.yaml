- id: M101
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "basic-memory (AGPL-3.0) lagrar anteckningar som Markdown-filer som både människor och modeller läser och skriver, med ett lokalt SQLite-index och utan krav på servrar. Egen drift är gratis och synkroniseringen mellan enheter är manuell, till exempel med Git eller Syncthing. Den värdbaserade teamarbetsytan kostar 15,00 dollar i månaden och allt en teammedlem skriver är, enligt projektet, omedelbart tillgängligt för alla andra och deras AI-assistenter. En felaktig post når dem lika snabbt som en riktig"
    en: "basic-memory (AGPL-3.0) keeps notes as Markdown files that people and models both read and write, with a local SQLite index and no servers required. Self-hosted it is free and syncing between devices is manual, with Git or Syncthing for instance. Its hosted team workspace costs $15.00 a month, and anything a teammate writes, it says, is immediately available to everyone else and to their AI assistants. A wrong entry reaches them as fast as a right one"
  vendor: Basic Machines (basic-memory)
  url: https://github.com/basicmachines-co/basic-memory
  final_url: https://github.com/basicmachines-co/basic-memory
  quote: "structured Markdown files that humans and LLMs both read and write"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

