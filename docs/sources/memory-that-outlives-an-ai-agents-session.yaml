- id: M96
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Referensservern i repot för Model Context Protocol beskriver sig själv som \"en grundläggande implementation av beständigt minne med en lokal kunskapsgraf\" (vår översättning). Den lagrar grafen i en fil, så det finns inget att drifta. Flera klienter på en dator kan dela filen, eftersom varje skrivning tar ett lås. README lägger till två förbehåll. Ett nätverksfilsystem som inte respekterar låset går inte att dela säkert på det här sättet. Dessutom finns det som standard ingen gräns för hur stor grafen kan bli. Repot kallar sina servrar referensimplementationer och inte produktionsfärdiga lösningar"
    en: "The reference server in the Model Context Protocol project's repository describes itself as \"a basic implementation of persistent memory using a local knowledge graph\". It keeps the graph in one file, so there is nothing to host. Several clients on one computer can share the file, because every write takes a lock. The README adds two cautions: a network file system that does not honour the lock cannot be shared safely this way, and by default nothing caps the graph. The repository calls its servers reference implementations and not production-ready solutions"
  vendor: Model Context Protocol (reference servers)
  url: https://github.com/modelcontextprotocol/servers/tree/main/src/memory
  final_url: https://github.com/modelcontextprotocol/servers/tree/main/src/memory
  quote: "A basic implementation of persistent memory using a local knowledge graph."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

