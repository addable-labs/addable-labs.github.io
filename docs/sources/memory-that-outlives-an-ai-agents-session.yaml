- id: M32
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "GitHubs dokumentation beskriver en arbetsfördelning: använd anpassade instruktioner för viktiga regler – som ett säkerhetskrav eller ett obligatoriskt granskningssteg – och låt Copilot Memory ta hand om den ackumulerade detaljrikedomen som annars skulle göra en instruktionsfil lång och svår att underhålla. Claude Codes sida sorterar dem efter syfte: CLAUDE.md-filer för att styra Claudes beteende, automatiskt minne för att låta Claude lära sig av dina korrigeringar"
    en: "GitHub's documentation describes a division of labour: use custom instructions for important rules, such as a security requirement or a mandatory review step, and let Copilot Memory handle the accumulated detail that would otherwise make an instructions file long and hard to maintain. Claude Code's page sorts them by purpose: CLAUDE.md files to guide Claude's behaviour, auto memory to let Claude learn from your corrections"
  vendor: GitHub
  url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  final_url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  quote: "Use custom instructions to state important rules, such as a security requirement or a mandatory review step, and let Copilot Memory handle the accumulated detail that would otherwise make an instructions file long and hard to maintain."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

