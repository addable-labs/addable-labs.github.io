  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Författarna testade också ett försvar på promptnivå. Det minskade i många konfigurationer antalet instruktioner som nådde minnet, men gav begränsat skydd när minnet väl hade förgiftats. Det som stoppar en förgiftad instruktion oavsett vad modellen bestämmer är en gräns utanför modellen. Därför spelar sådana gränser större roll med minne, inte mindre. Den förgiftade posten ligger i minnesförrådet och når varje senare session som läser den. Gränsen sitter efter agenten"
    en: "The authors also tested one prompt-level defence, which reduced memory injection in many settings but gave limited protection once the memory had been poisoned. What stops a poisoned instruction whatever the model decides is a limit outside it, which is why such limits matter more with memory, not less. The poisoned entry sits in the store and reaches every later session that reads it, and the limit stands after the agent"
  vendor: "University of Auckland and Fudan University (arXiv)"
  url: https://arxiv.org/html/2609.13889v1
  final_url: https://arxiv.org/html/2609.13889v1
  quote: "provides limited protection once the persistent memory has been poisoned"
  retrieved: 2026-11-21
  last_checked: 2026-11-22

