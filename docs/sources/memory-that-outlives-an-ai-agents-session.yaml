- id: M57
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Cloud agent och code review sparar ett minne utan att fråga dig. Copilot-appen och det interaktiva kommandoradsverktyget kan be dig godkänna ett minne innan det sparas. I Copilot skapas repo-fakta bara när Copilot arbetar i ett repo där du har skrivrättigheter. GitHubs dokumentation tillägger att repo-fakta kan fångas upp ur pull requests som stängdes utan att mergas. Copilot ska kontrollera dem mot den aktuella kodbasen, men det garanterar inte att den känner igen varje föråldrat faktum"
    en: "The cloud agent and code review store a memory without asking you; the Copilot app and the interactive command-line tool can ask you to approve it first. In Copilot, repository facts are created only when Copilot works in a repository where the user has write access. GitHub's documentation adds that repository facts can be captured from pull requests that were closed without merging, and that Copilot is told to check them against the current codebase, which does not guarantee that it recognises every outdated fact"
  vendor: GitHub
  url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  final_url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  quote: "Repository-level facts are only created when Copilot is working in a repository you have write access to"
  retrieved: 2026-11-21
  last_checked: 2026-11-22

- id: M58
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Cloud agent och code review sparar ett minne utan att fråga dig. Copilot-appen och det interaktiva kommandoradsverktyget kan be dig godkänna ett minne innan det sparas. I Copilot skapas repo-fakta bara när Copilot arbetar i ett repo där du har skrivrättigheter. GitHubs dokumentation tillägger att repo-fakta kan fångas upp ur pull requests som stängdes utan att mergas. Copilot ska kontrollera dem mot den aktuella kodbasen, men det garanterar inte att den känner igen varje föråldrat faktum"
    en: "The cloud agent and code review store a memory without asking you; the Copilot app and the interactive command-line tool can ask you to approve it first. In Copilot, repository facts are created only when Copilot works in a repository where the user has write access. GitHub's documentation adds that repository facts can be captured from pull requests that were closed without merging, and that Copilot is told to check them against the current codebase, which does not guarantee that it recognises every outdated fact"
  vendor: GitHub
  url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  final_url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  quote: "In the Copilot app, and Copilot CLI interactive sessions, Copilot can ask you to approve storing a memory. Copilot cloud agent and Copilot code review do not ask for this approval."
  retrieved: 2026-11-21
  last_checked: 2026-11-22

- id: M59
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Cloud agent och code review sparar ett minne utan att fråga dig. Copilot-appen och det interaktiva kommandoradsverktyget kan be dig godkänna ett minne innan det sparas. I Copilot skapas repo-fakta bara när Copilot arbetar i ett repo där du har skrivrättigheter. GitHubs dokumentation tillägger att repo-fakta kan fångas upp ur pull requests som stängdes utan att mergas. Copilot ska kontrollera dem mot den aktuella kodbasen, men det garanterar inte att den känner igen varje föråldrat faktum"
    en: "The cloud agent and code review store a memory without asking you; the Copilot app and the interactive command-line tool can ask you to approve it first. In Copilot, repository facts are created only when Copilot works in a repository where the user has write access. GitHub's documentation adds that repository facts can be captured from pull requests that were closed without merging, and that Copilot is told to check them against the current codebase, which does not guarantee that it recognises every outdated fact"
  vendor: GitHub
  url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
