- id: M122
  article: memory-that-outlives-an-ai-agents-session
  sentence:
    sv: "Ett faktum i ett delat minne – eller i en fil som hela teamet committar – påverkar varje session som läser det. Det som läses in i början, till exempel en instruktionsfil eller ett index över minnen, finns där innan någon har frågat något"
    en: "A fact in a shared memory, or in a file the whole team commits, affects every session that reads it, and what loads at the start, such as an instruction file or a memory index, is there before anyone has asked anything"
  vendor: GitHub
  url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  final_url: https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory
  quote: "Not all memories from the memory store are sent to a model with your prompt."
  retrieved: 2026-11-22
  last_checked: 2026-11-22

