- id: P4-sb-setup
  article: skills-for-repeatable-work
  sentence:
    sv: "gav AI-agenter 87 uppgifter, var och en med tester som poängsätter resultatet."
    en: "gave AI agents 87 tasks, each with tests that score the result."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "87 tasks across 8 domains paired with curated Skills and deterministic verifiers"
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-experts
  article: skills-for-repeatable-work
  sentence:
    sv: "Varje uppgift kördes med och utan en färdighet som experter hade tagit fram för den sortens uppgift."
    en: "Every task was run with and without a skill that experts had put together for that kind of task."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "Each task ships with a containerized environment, human-authored instruction, expert-curated Skills bundle"
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-gain
  article: skills-for-repeatable-work
  sentence:
    sv: "klarade agenterna ungefär 34 uppgifter av 100 utan färdigheten och ungefär 50 med den."
    en: "the agents passed about 34 tasks in 100 without the skill and about 50 with it."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "Curated Skills raise the average pass rate from 33.9% to 50.5%"
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-every
  article: skills-for-repeatable-work
  sentence:
    sv: "Alla kombinationer förbättrades, men i mycket olika grad."
    en: "Every combination improved, but by very different amounts."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "Every one of the 18 model–harness configurations improves with curated Skills"
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-self
  article: skills-for-repeatable-work
  sentence:
    sv: "Tre av kombinationerna fick också skriva färdigheter åt sig själva innan de löste varje uppgift. Med de färdigheterna hamnade de under resultatet utan någon färdighet alls, alla tre."
    en: "Three of the combinations also wrote skills for themselves before they solved each task. With those skills they fell below the result with no skill at all, in all three."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "Self-generated Skills land below the no-Skills baseline on all three configurations"
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-why
  article: skills-for-repeatable-work
  sentence:
    sv: "Forskarna skriver att underskottet blandar textens kvalitet med andra effekter: agenten använde ofta aldrig färdigheten den hade skrivit och i en del körningar åt arbetet med att skriva den upp det som skulle ha gått till uppgiften."
    en: "The paper says the shortfall mixes the quality of the text with other effects: the agent frequently never used the skill it had written, and in some runs writing it used up the effort meant for the task."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "its deficit mixes content quality with skill-discovery and creator/solver interference effects … generated packs frequently go unused by the solver, creator-side authoring can displace solver progress"
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-conclusion
  article: skills-for-repeatable-work
  sentence:
    sv: "Forskarna drar själva slutsatsen att \"en färdighets effekt är alltså en empirisk egenskap hos en viss agentstack och inte en universell konstant\" (vår översättning)."
    en: "The paper itself concludes that \"Skill efficacy is therefore an empirical property of a specific agent stack rather than a universal constant\"."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "Skill efficacy is therefore an empirical property of a specific agent stack rather than a universal constant."
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-factory-proof
  article: skills-for-repeatable-work
  sentence:
    sv: "fick varje arbetspaket ett eget beviskommando, ett kommando som går igenom eller inte"
    en: "each work item got its own proof command, a command that passes or fails"
  vendor: Addable Labs
  url: https://addablelabs.se/blog/how-this-site-was-built-by-agents/
  final_url: https://addablelabs.se/blog/how-this-site-was-built-by-agents/
  quote: "The decomposition cut the plan into work items, each with its own proof command"
  retrieved: 2026-10-30
  last_checked: 2026-10-30
