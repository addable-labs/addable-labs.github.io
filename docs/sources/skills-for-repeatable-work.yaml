  article: skills-for-repeatable-work
  sentence:
    sv: "mappen och dess SKILL.md ser likadana ut i var och en."
    en: "the folder and its SKILL.md look the same in each."
  vendor: GitHub
  url: https://code.visualstudio.com/docs/agent-customization/agent-skills
  final_url: https://code.visualstudio.com/docs/agent-customization/agent-skills
  quote: "Agent Skills is an open standard that works across multiple AI agents, including GitHub Copilot in VS Code, GitHub Copilot CLI, the GitHub Copilot app, and the experimental OpenAI Codex integration."
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-setup
  article: skills-for-repeatable-work
  sentence:
    sv: "gav AI-agenter 87 uppgifter, var och en med tester som poängsätter resultatet."
    en: "gave AI agents 87 tasks, each with tests that score the result."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "87 tasks across 8 domains paired with curated Skills and deterministic verifiers"
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-experts
  article: skills-for-repeatable-work
  sentence:
    sv: "Varje uppgift kördes med och utan en färdighet som experter hade tagit fram för den sortens uppgift."
    en: "Every task was run with and without a skill that experts had put together for that kind of task."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "Each task ships with a containerized environment, human-authored instruction, expert-curated Skills bundle"
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-eighteen
  article: skills-for-repeatable-work
  sentence:
    sv: "Agenterna var 18 kombinationer av en modell och ett verktyg."
    en: "The agents were 18 combinations of a model and a tool."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "we evaluate 18 configurations across four terminal-agent harnesses"
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-gain
  article: skills-for-repeatable-work
  sentence:
    sv: "Som genomsnitt över alla klarade de ungefär 34 uppgifter av 100 utan färdigheten och ungefär 50 med den."
    en: "Averaged over all of them, they passed about 34 tasks in 100 without the skill and about 50 with it."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "Curated Skills raise the average pass rate from 33.9% to 50.5%"
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-every
  article: skills-for-repeatable-work
  sentence:
    sv: "Varje kombination klarade fler uppgifter med färdigheten, men vinsten skilde sig mycket: från ungefär 4 fler uppgifter av 100 till ungefär 26 fler."
    en: "Every combination passed more tasks with the skill, but the gain differed a lot: from about 4 more tasks in 100 to about 26 more."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "Every one of the 18 model–harness configurations improves with curated Skills … the spread is large (+4.1 to +25.7 pp)"
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-interval
  article: skills-for-repeatable-work
  sentence:
    sv: "Forskarna markerar ett osäkerhetsintervall, ett 95-procentigt konfidensintervall, kring varje kombinations resultat. De redovisar inget test av om en vinst kan bero på enbart slumpen."
    en: "The paper marks a range of uncertainty, a 95% confidence interval, around each combination's pass rates. It reports no test of whether a gain could be chance alone."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "we compute 95% binomial (Wald) confidence intervals … Normalized gain is reported as a point estimate."
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-worse
  article: skills-for-repeatable-work
  sentence:
    sv: "På 13 av de 87 uppgifterna blev genomsnittsresultatet sämre med färdigheten."
    en: "On 13 of the 87 tasks the average result was worse with the skill."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "13 of 87 tasks show negative Skills deltas"
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-software
  article: skills-for-repeatable-work
  sentence:
    sv: "I programvaruutveckling, området för exemplet med releasen, var vinsten ungefär 12 uppgifter av 100 mot ungefär 17 för alla uppgifter."
    en: "In software engineering, the field of the release example, the gain was about 12 tasks in 100 against about 17 for all tasks."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "Software Engineering (+11.6 pp) and Mathematics & OR (+9.7 pp) benefit least"
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-self
  article: skills-for-repeatable-work
  sentence:
    sv: "Tre av kombinationerna fick också skriva färdigheter åt sig själva innan de löste varje uppgift. Med de färdigheterna klarade de 8 till 12 färre uppgifter av 100 än utan någon färdighet alls."
    en: "Three of the combinations also wrote skills for themselves before they solved each task. With those skills they passed 8 to 12 fewer tasks in 100 than with no skill at all."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "On all three configurations, self-generated Skills land below the no-Skills baseline"
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-why
  article: skills-for-repeatable-work
  sentence:
    sv: "Forskarna skriver att underskottet blandar textens kvalitet med andra effekter: agenten använde ofta aldrig färdigheten den hade skrivit och i en del körningar gick kraften åt till att skriva färdigheten i stället för att lösa uppgiften."
    en: "The paper says the shortfall mixes the quality of the text with other effects: the agent frequently never used the skill it had written, and in some runs writing it used up the effort meant for the task."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "its deficit mixes content quality with skill-discovery and creator/solver interference effects … generated packs frequently go unused by the solver, creator-side authoring can displace solver progress"
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-optimistic
  article: skills-for-repeatable-work
  sentence:
    sv: "Dess färdigheter var utvalda för sin kvalitet, vilket forskarna kallar \"ett optimistiskt scenario\" (vår översättning)."
    en: "Its skills were picked for quality, which the paper calls \"an optimistic scenario\"."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "Our 87 tasks with high-quality Skills represent an optimistic scenario."
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-terminal
  article: skills-for-repeatable-work
  sentence:
    sv: "Uppgifterna kördes i en terminal."
    en: "Its tasks ran in a terminal."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "SkillsBench focuses on terminal-based, containerized tasks for reproducible evaluation"
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-isolate
  article: skills-for-repeatable-work
  sentence:
    sv: "Studien skilde inte ut vad i en färdighet som gör jobbet: forskarna nämner \"steg, exempel, kodresurser\" (vår översättning) som de delar som framtida arbete måste isolera. Den visar inte att ett skript hjälper mer än instruktioner."
    en: "It did not separate what in a skill does the work: the paper names \"steps, examples, code resources\" as the parts that future work has to isolate. It does not show that a script helps more than instructions do."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "to isolate which components (steps, examples, code resources) drive improvement"
  retrieved: 2026-10-30
  last_checked: 2026-10-30
- id: P4-sb-conclusion
  article: skills-for-repeatable-work
  sentence:
    sv: "Forskarna drar slutsatsen att hur mycket en färdighet hjälper beror på den enskilda kombinationen av modell och verktyg."
    en: "The paper concludes that how much a skill helps depends on the particular combination of model and tool."
  vendor: arXiv
  url: https://arxiv.org/html/2602.12670v4
  final_url: https://arxiv.org/html/2602.12670v4
  quote: "Skill efficacy is therefore an empirical property of a specific agent stack rather than a universal constant."
  retrieved: 2026-10-30
  last_checked: 2026-10-30
