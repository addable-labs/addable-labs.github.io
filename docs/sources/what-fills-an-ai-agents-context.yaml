- id: C24
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Två praktiker har namn på mekanismen. Simon Willison beskriver en subagent som en separat agentloop med en ny tokenkontext och Drew Breunig kallar det att isolera kontexter i egna trådar för kontextkarantän (context quarantine). Det är praktikers termer, inte leverantörernas"
    en: "Two practitioners have names for the mechanism. Simon Willison describes a subagent as a separate agent loop with a fresh token context, and Drew Breunig calls the act of isolating contexts in their own threads context quarantine. These are practitioners' terms, not the vendors'"
  vendor: Simon Willison
  url: https://simonwillison.net/2025/Oct/11/sub-agents/
  final_url: https://simonwillison.net/2025/Oct/11/sub-agents/
  quote: "a separate agent loop with a fresh token context"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C25
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Två praktiker har namn på mekanismen. Simon Willison beskriver en subagent som en separat agentloop med en ny tokenkontext och Drew Breunig kallar det att isolera kontexter i egna trådar för kontextkarantän (context quarantine). Det är praktikers termer, inte leverantörernas"
    en: "Two practitioners have names for the mechanism. Simon Willison describes a subagent as a separate agent loop with a fresh token context, and Drew Breunig calls the act of isolating contexts in their own threads context quarantine. These are practitioners' terms, not the vendors'"
  vendor: Drew Breunig
  url: https://www.dbreunig.com/2025/06/26/how-to-fix-your-context.html
  final_url: https://www.dbreunig.com/2025/06/26/how-to-fix-your-context.html
  quote: "Context Quarantine is the act of isolating contexts in their own dedicated threads"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C26
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "En full kontext avslutar inte sessionen. Claude Code komprimerar automatiskt när du närmar dig gränsen, VS Code komprimerar automatiskt äldre delar av samtalet till en sammanfattning och Codex komprimerar också chattar automatiskt"
    en: "A full context does not end the session. Claude Code compacts automatically as you approach the limit, VS Code automatically compacts older parts of the conversation into a summary, and Codex also compacts chats automatically"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/context-window
  final_url: https://code.claude.com/docs/en/context-window
  quote: "Claude Code compacts automatically as you approach the limit, so a full context window doesn't end your session."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

