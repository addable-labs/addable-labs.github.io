- id: C63
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Skills som har använts i sessionen kommer också tillbaka, inom en storleksgräns. Resten av samtalet finns i sammanfattningen eller är borta. Regler som gäller en viss sökväg och nästlade CLAUDE.md-filer, som bara läses in när Claude rör en matchande fil, försvinner i sammanfattningen på samma sätt. De läses in igen först när Claude rör en sådan fil. En regel som måste finnas kvar hör därför hemma i CLAUDE.md i projektets rot"
    en: "Skills used in the session come back too, within a size limit. The rest of the conversation is in the summary, or gone. Path-scoped rules and nested CLAUDE.md files, which load only when Claude touches a matching file, are summarised away like the rest. They load again only when Claude touches such a file, so a rule that must persist belongs in the project-root CLAUDE.md"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/context-window
  final_url: https://code.claude.com/docs/en/context-window
  quote: "Skill bodies are re-injected after compaction, but large skills are truncated to fit the per-skill cap"
  retrieved: 2026-11-22
  last_checked: 2026-11-22

