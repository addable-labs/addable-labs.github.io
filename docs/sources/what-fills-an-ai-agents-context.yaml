- id: C09
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Det som blir kvar skickas igen. Claude Codes sida om bästa praxis uttrycker det så här: \"Varje begäran skickar hela samtalet, så en session som har samlat tre orelaterade uppgifter läser om alla tre i varje varv av den fjärde.\" (vår översättning)"
    en: "What stays is sent again. Claude Code's best-practices page puts it this way: \"Every request sends the whole conversation, so a session that's collected three unrelated tasks re-reads all three on every turn of the fourth.\""
  vendor: Anthropic
  url: https://code.claude.com/docs/en/best-practices
  final_url: https://code.claude.com/docs/en/best-practices
  quote: "Every request sends the whole conversation, so a session that's collected three unrelated tasks re-reads all three on every turn of the fourth."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C10
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Den andra kostnaden är modellens uppmärksamhet. Anthropics ingenjörer kallar effekten kontextröta (context rot): när antalet tokens i kontextfönstret ökar minskar modellens förmåga att på ett riktigt sätt återge information ur kontexten"
    en: "The second cost is the model's attention. Anthropic's engineering team calls the effect context rot: as the number of tokens in the context window increases, the model's ability to accurately recall information from that context decreases"
  vendor: Anthropic
  url: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
  final_url: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
  quote: "as the number of tokens in the context window increases, the model’s ability to accurately recall information from that context decreases."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C11
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Chroma testade 18 modeller i juli 2025 och rapporterade att deras prestanda blir allt mindre tillförlitlig när indatan blir längre. Modellerna är från 2025, så effektens storlek i dag är en fråga för nyare tester, men riktningen är den som leverantörerna beskriver"
    en: "Chroma tested 18 models in July 2025 and reported that their performance grows increasingly unreliable as input length grows. The models are from 2025, so the size of the effect today is a question for newer tests, but the direction is the one the vendors describe"
  vendor: Chroma
  url: https://www.trychroma.com/research/context-rot
  final_url: https://www.trychroma.com/research/context-rot
  quote: "their performance grows increasingly unreliable as input length grows."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C12
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Anthropics guide till kontextteknik drar slutsatsen att god kontextteknik betyder att hitta den minsta möjliga uppsättningen tokens med hög signal som maximerar sannolikheten för ett önskat resultat"
    en: "Anthropic's guide to context engineering draws the conclusion that good context engineering means finding the smallest possible set of high-signal tokens that maximise the likelihood of some desired outcome"
  vendor: Anthropic
  url: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
  final_url: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
  quote: "good context engineering means finding the smallest possible set of high-signal tokens that maximize the likelihood of some desired outcome."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C13
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Du kan se dina egna siffror. I Claude Code ger /context en levande uppdelning per kategori med förslag på optimeringar, inklusive vilka CLAUDE.md- och automatiska minnesfiler som lästes in. Att titta en gång i början av en session och en gång efter en lång uppgift visar det som figurerna bara skissar"
    en: "You can see your own numbers. In Claude Code, /context gives a live breakdown by category with optimisation suggestions, including which CLAUDE.md and auto memory files loaded. Looking once at the start of a session and once after a long task shows what the figures only sketch"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/context-window
  final_url: https://code.claude.com/docs/en/context-window
  quote: "To see your actual context usage at any point, run `/context` for a live breakdown by category with optimization suggestions, including which CLAUDE.md and auto memory files loaded."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C14
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "En subagent är en andra agent som huvudagenten lämnar en uppgift till och den börjar med en egen kontext. Claude Codes dokumentation rekommenderar en när en sidouppgift skulle fylla huvudsamtalet med sökresultat, loggar eller filinnehåll som du inte kommer att titta på igen: subagenten gör det arbetet i sin egen kontext och lämnar bara tillbaka sammanfattningen"
    en: "A subagent is a second agent that the main agent hands a task to, and it starts with a context of its own. Claude Code's documentation recommends one when a side task would flood the main conversation with search results, logs or file contents you will not refer to again: the subagent does that work in its own context and returns only the summary"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/sub-agents
  final_url: https://code.claude.com/docs/en/sub-agents
  quote: "the subagent does that work in its own context and returns only the summary"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C15
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Sidan om kontextfönstret lägger till att bara sammanfattningen och en liten metadatasvans kommer tillbaka"
    en: "The context-window page adds that only the summary and a small metadata trailer come back"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/context-window
  final_url: https://code.claude.com/docs/en/context-window
  quote: "Only the summary and a small metadata trailer come back."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C16
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Codex dokumentation beskriver problemet som en subagent löser från andra hållet. Om du fyller huvudchatten med utforskningsanteckningar, testloggar, stackspår och kommandoutdata kan sessionen enligt den bli mindre tillförlitlig med tiden"
    en: "Codex's documentation describes the problem a subagent solves from the other side. If you flood the main chat with exploration notes, test logs, stack traces and command output, it says, the session can become less reliable over time"
  vendor: OpenAI
  url: https://learn.chatgpt.com/docs/agent-configuration/subagents
  final_url: https://learn.chatgpt.com/docs/agent-configuration/subagents
  quote: "If you flood the main chat (where you're defining requirements, constraints, and decisions) with noisy intermediate output such as exploration notes, test logs, stack traces, and command output, the session can become less reliable over time."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C17
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Den namnger två effekter: kontextförorening (context pollution), där användbar information begravs under brusiga mellanresultat och kontextröta, där prestandan sjunker när chatten fylls med mindre relevanta detaljer"
    en: "It names two effects: context pollution, where useful information gets buried under noisy intermediate output, and context rot, where performance degrades as the chat fills up with less relevant details"
  vendor: OpenAI
  url: https://learn.chatgpt.com/docs/agent-configuration/subagents
  final_url: https://learn.chatgpt.com/docs/agent-configuration/subagents
  quote: "useful information gets buried under noisy intermediate output"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C18
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Den namnger två effekter: kontextförorening (context pollution), där användbar information begravs under brusiga mellanresultat och kontextröta, där prestandan sjunker när chatten fylls med mindre relevanta detaljer"
    en: "It names two effects: context pollution, where useful information gets buried under noisy intermediate output, and context rot, where performance degrades as the chat fills up with less relevant details"
  vendor: OpenAI
  url: https://learn.chatgpt.com/docs/agent-configuration/subagents
  final_url: https://learn.chatgpt.com/docs/agent-configuration/subagents
  quote: "performance degrades as the chat fills up with less relevant details"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C19
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "En subagent är inte gratis. Enligt Claude Codes sida om bästa praxis är kostnaden mest tokens, eftersom varje subagent skickar egna begäranden och de räknas mot samma användning som huvudsamtalet"
    en: "A subagent is not free. According to Claude Code's best-practices page, what it costs is mostly tokens, since every subagent sends its own requests and they count against the same usage as the main conversation"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/best-practices
  final_url: https://code.claude.com/docs/en/best-practices
  quote: "What they cost you is mostly tokens, since every subagent sends its own requests and they count against the same usage as your main conversation."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C20
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Ibland kostar den också tid, eftersom en ny subagent först måste samla ihop kontext som huvudsamtalet redan hade"
    en: "Sometimes it costs time too, because a fresh subagent first has to gather context that the main conversation already had"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/best-practices
  final_url: https://code.claude.com/docs/en/best-practices
  quote: "a fresh subagent first has to gather context your conversation already had"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C21
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Anthropic mätte samma avvägning i sitt eget forskningssystem med flera agenter i juni 2025: i dess data använde agenter ungefär fyra gånger så många tokens som chattar och system med flera agenter ungefär femton gånger så många. Det är siffror för det systemet, inte en regel för kodande agenter"
    en: "Anthropic measured the same trade in its own multi-agent research system in June 2025: in its data, agents used about four times as many tokens as chat interactions, and multi-agent systems about fifteen times as many. Those are figures for that system, not a rule for coding agents"
  vendor: Anthropic
  url: https://www.anthropic.com/research/multi-agent-research-system
  final_url: https://www.anthropic.com/research/multi-agent-research-system
  quote: "agents typically use about 4× more tokens than chat interactions, and multi-agent systems use about 15× more tokens than chats."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C22
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "En separat kontext är inte en separat plats att arbeta på. VS Codes dokumentation sammanfattar det i en mening: kontextisolering är inte kodisolering. Den skapar inte i sig ett separat arbetsträd eller en sandlåda, så vad subagenten får röra beror på de behörigheter den körs med, vilket del 7 av serien går igenom"
    en: "A separate context is not a separate place to work. VS Code's documentation puts it in one sentence: context isolation is not code isolation. It does not by itself create a separate worktree or sandbox, so what the subagent may touch depends on the permissions it runs under, which part 7 of the series covers"
  vendor: Microsoft
  url: https://code.visualstudio.com/docs/agents/concepts/context
  final_url: https://code.visualstudio.com/docs/agents/concepts/context
  quote: "Context isolation is not code isolation."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

