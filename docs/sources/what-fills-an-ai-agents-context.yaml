# The sources of "What fills an AI agent's context" (both languages):
# one entry per factual claim about a tool, a vendor or a published article of
# ours, for the monthly check of the series' sources. Every quote was taken from
# its page on 2026-11-21 and checked again on the same date. The explanations
# that join the claims, the habits to start with and the readings of what the
# sources say are the article's own and have no entry of their own; the two
# user reports are labelled as such in the text.
- id: C59
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Språkmodellen bakom en AI-agent för kodning minns inte ditt samtal från ett steg till nästa. Varje gång verktyget frågar modellen vad den ska göra skickar det med allt som modellen ska se: instruktionerna, filerna som har lästs, utdata från kommandona som har körts och samtalet hittills. Allt det tillsammans är kontexten"
    en: "The language model behind an AI coding agent does not remember your conversation from one step to the next. Each time the tool asks the model what to do, it sends along everything the model should see: the instructions, the files it has read, the output of the commands it has run and the conversation so far. That bundle is the context"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/best-practices
  final_url: https://code.claude.com/docs/en/best-practices
  quote: "Every request sends the whole conversation, so a session that's collected three unrelated tasks re-reads all three on every turn of the fourth."
  retrieved: 2026-11-22
  last_checked: 2026-11-22

