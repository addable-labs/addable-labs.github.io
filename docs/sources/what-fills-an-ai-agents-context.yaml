- id: C43
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "En agent kan inte göra planeringen själv, eftersom en session inte kan se sin egen kontextanvändning. Gas City, det öppna verktyg som kör fabrikens agenter, har därför en hook som gör det åt agenten"
    en: "An agent cannot do the planning by itself, because a session cannot see its own context usage. Gas City, the open-source tool that runs the factory's agents, therefore has a hook that does it for the agent"
  vendor: Gas City
  url: https://raw.githubusercontent.com/gastownhall/gascity/main/cmd/gc/context_inject.go
  final_url: https://raw.githubusercontent.com/gastownhall/gascity/main/cmd/gc/context_inject.go
