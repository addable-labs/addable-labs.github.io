  sentence:
    sv: "Hooken är, med kodens egna ord, avsiktligt styrd av trösklar och inte en nedräkning som alltid är på. Den läser tokenantalet ur sessionens transkript och är tyst under en första nivå. Över den första nivån ber den agenten planera mot en ren överlämningspunkt. Över den andra nivån ber den agenten utlösa den ordinarie överlämningen nu"
    en: "The hook is, in the code's own words, threshold-gated by design and not an always-on countdown: it reads the token count from the session's transcript, stays silent below a first level, then tells the agent to plan toward a clean handoff point and, above a second level, to trigger the canonical handoff now"
  vendor: Gas City
  url: https://raw.githubusercontent.com/gastownhall/gascity/main/cmd/gc/context_inject.go
  final_url: https://raw.githubusercontent.com/gastownhall/gascity/main/cmd/gc/context_inject.go
  quote: "trigger the canonical handoff now"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C49
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Tanken handlar om vem som avgör vad som överlever. Vid komprimering skriver verktyget sammanfattningen. Vid en planerad överlämning skriver agenten ner det nästa session behöver medan den ännu kan. Koden nämner vad som annars skulle gå förlorat: den medvetna avslutningen"
    en: "The idea is about who decides what survives. In compaction the tool writes the summary. In a planned hand-off the agent writes down what the next session needs while it still can, and the code names what would be lost otherwise: the deliberate wrap-up"
  vendor: Gas City
  url: https://raw.githubusercontent.com/gastownhall/gascity/main/cmd/gc/context_inject.go
  final_url: https://raw.githubusercontent.com/gastownhall/gascity/main/cmd/gc/context_inject.go
  quote: "losing the deliberate wrap-up"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C68
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Hookens två nivåer är andelar av det fönster som Gas City utgår från för modellen, så den siffran måste stämma"
    en: "The hook's two levels are shares of the window that Gas City assumes for the model, so that number has to be right"
  vendor: Gas City
  url: https://raw.githubusercontent.com/gastownhall/gascity/main/cmd/gc/context_inject.go
  final_url: https://raw.githubusercontent.com/gastownhall/gascity/main/cmd/gc/context_inject.go
  quote: "overrides the context-window size when model-string detection is wrong"
  retrieved: 2026-11-22
  last_checked: 2026-11-22

