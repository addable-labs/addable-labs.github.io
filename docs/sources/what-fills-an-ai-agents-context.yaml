# The sources of "What fills an AI agent's context" (both languages):
# one entry per factual claim about a tool, a vendor or a published article of
# ours, for the monthly check of the series' sources. Every quote was taken from
# its page on 2026-11-21 and checked again on the same date. The explanations
# that join the claims, the habits to start with and the readings of what the
# sources say are the article's own and have no entry of their own; the two
# user reports are labelled as such in the text.
- id: C01
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "VS Codes dokumentation definierar den som den information som agenten och dess språkmodell har tillgång till medan de arbetar med din begäran"
    en: "VS Code's documentation defines it as the information available to the agent and its language model while they work on your request"
  vendor: Microsoft
  url: https://code.visualstudio.com/docs/agents/concepts/context
  final_url: https://code.visualstudio.com/docs/agents/concepts/context
  quote: "Context is the information available to an AI agent and its language model while they work on your request."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C02
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Samma sida är tydlig med vad den inte är: att lägga till kontext är inte detsamma som att träna en modell"
    en: "The same page is plain about what it is not: adding context is not the same as training a model"
  vendor: Microsoft
  url: https://code.visualstudio.com/docs/agents/concepts/context
  final_url: https://code.visualstudio.com/docs/agents/concepts/context
  quote: "Adding context is not the same as training a model."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C03
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Enligt Claude Codes dokumentation rymmer kontextfönstret allt som Claude vet om din session: dina instruktioner, filerna den läser, dess egna svar och innehåll som aldrig syns i din terminal"
    en: "According to Claude Code's documentation, the context window holds everything Claude knows about your session: your instructions, the files it reads, its own responses and content that never appears in your terminal"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/context-window
  final_url: https://code.claude.com/docs/en/context-window
  quote: "Claude Code's context window holds everything Claude knows about your session: your instructions, the files it reads, its own responses, and content that never appears in your terminal."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C04
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Allt räknas mot samma gräns. VS Codes dokumentation säger att användarens meddelande, samtalshistoriken, instruktioner, refererade filer och verktygens utdata alla tar plats i kontextfönstret och den definierar fönstret som den största mängd information som en språkmodell kan behandla i en begäran"
    en: "Everything counts against one limit. VS Code's documentation says that the user message, the conversation history, instructions, referenced files and tool outputs all use space in the context window, and it defines the window as the maximum amount of information a language model can process in one request"
  vendor: Microsoft
  url: https://code.visualstudio.com/docs/agents/concepts/context
  final_url: https://code.visualstudio.com/docs/agents/concepts/context
  quote: "The user message, conversation history, instructions, referenced files, and tool outputs all use space in this window."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

