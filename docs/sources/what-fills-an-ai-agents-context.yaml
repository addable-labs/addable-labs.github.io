- id: C55
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Motvikten kommer från en annan praktiker. I juli 2025 skrev Armin Ronacher att även om subagenter borde bevara kontext bättre gav det ofta bättre resultat att börja nya sessioner och skriva ner tankar i Markdown-filer"
    en: "The counterweight comes from another practitioner. In July 2025 Armin Ronacher wrote that although subagents should preserve context better, starting new sessions and writing thoughts to Markdown files often gave better results"
  vendor: Armin Ronacher
  url: https://lucumr.pocoo.org/2025/7/30/things-that-didnt-work/
  final_url: https://lucumr.pocoo.org/2025/7/30/things-that-didnt-work/
  quote: "While sub-agents should preserve context better, I often get better results by starting new sessions, writing thoughts to Markdown files"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C56
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Anthropics guide ger tekniken ett namn, strukturerat antecknande (structured note-taking): agenten skriver regelbundet anteckningar som sparas utanför kontextfönstret. Den tekniken är ämnet för en senare artikel om minne"
    en: "Anthropic's guide gives the technique a name, structured note-taking, where the agent regularly writes notes persisted outside of the context window, and that is the subject of a later article on memory"
  vendor: Anthropic
  url: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
  final_url: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
  quote: "Structured note-taking, or agentic memory, is a technique where the agent regularly writes notes persisted to memory outside of the context window."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C57
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Användare rapporterar också gränserna ovan som friktion. Två exempel, båda från användare av Claude Code, är användarrapporter och inte domar över verktyget. I dess publika ärendehanterare påpekas i ett ärende – öppnat i februari 2026 och fortfarande öppet i november – att det inte finns något fungerande sätt att granska samtalshistorik som har rensats eller komprimerats. På Hacker News invände en kommentator i september 2026 att subagenter måste läsa om allt, vilket stämmer med Anthropics eget påpekande att en ny subagent först måste samla ihop kontext som huvudsamtalet redan hade"
    en: "Users also report the limits above as friction. Two examples, both from users of Claude Code, are user reports and not verdicts on the tool. On its public tracker, one issue, opened in February 2026 and still open in November, complains that there is no working way to review conversation history that has been cleared or compacted. On Hacker News in September 2026, a commenter objected that subagents have to re-read everything, which matches Anthropic's own note that a fresh subagent first has to gather context the main conversation already had"
  vendor: GitHub issue (user report)
  url: https://github.com/anthropics/claude-code/issues/27242
  final_url: https://github.com/anthropics/claude-code/issues/27242
  quote: "Claude Code has no working way to review conversation history that has been cleared or compacted."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

