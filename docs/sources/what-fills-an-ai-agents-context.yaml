- id: C33
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Allt annat finns i sammanfattningen eller är borta. Regler som gäller en viss sökväg och nästlade CLAUDE.md-filer, som bara läses in när Claude rör en matchande fil, sammanfattas bort tillsammans med resten av samtalet, så en regel som måste finnas kvar hör hemma i CLAUDE.md i projektets rot"
    en: "Everything else is in the summary, or gone. Path-scoped rules and nested CLAUDE.md files, which load only when Claude touches a matching file, are summarised away with the rest of the conversation, so a rule that must persist belongs in the project-root CLAUDE.md"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/context-window
  final_url: https://code.claude.com/docs/en/context-window
  quote: "Path-scoped rules and nested CLAUDE.md files load into message history when Claude reads, writes, or edits their trigger file, so compaction summarizes them away with everything else."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

