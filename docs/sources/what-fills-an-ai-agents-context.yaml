  sentence:
    sv: "Fabriken bakom den här sajten har ett konkret exempel på samma problem. Agenten som samordnar fabriken, borgmästaren, körs i sessioner som var och en slutar med en överlämning. Sessionen skriver ner läget i sitt arbete. Sedan fortsätter en ny session därifrån"
    en: "The factory behind this site has a worked case of the same problem. Its coordinating agent, the mayor, runs in sessions that each end at a hand-off: the session writes down the state of its work, and a new session continues from there"
