  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Medan Claude arbetar lägger enligt samma sida varje läst fil till i kontexten. Sidan säger också att tokenantalen i dess exempelsession är illustrativa och varierar med storleken på din CLAUDE.md, dina MCP-servrar och dina filers längd, så figurerna här visar bara relativa storlekar"
    en: "As Claude works, the same page says, each file read adds to context. It also says that the token counts in its example session are illustrative and vary with the size of your CLAUDE.md, your MCP servers and your file lengths, so the figures here show relative sizes only"
  vendor: Anthropic
