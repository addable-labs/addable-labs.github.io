  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C44
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Hooken är med kodens egna ord tröskelstyrd av design och inte en nedräkning som alltid är på: den läser tokenantalet ur sessionens transkript, är tyst under en första nivå, ber sedan agenten att planera mot en ren överlämningspunkt och, över en andra nivå, att utlösa den kanoniska överlämningen nu"
    en: "The hook is, in the code's own words, threshold-gated by design and not an always-on countdown: it reads the token count from the session's transcript, stays silent below a first level, then tells the agent to plan toward a clean handoff point and, above a second level, to trigger the canonical handoff now"
  vendor: Gas City
  url: https://raw.githubusercontent.com/gastownhall/gascity/main/cmd/gc/context_inject.go
  final_url: https://raw.githubusercontent.com/gastownhall/gascity/main/cmd/gc/context_inject.go
  quote: "THRESHOLD-GATED BY DESIGN — not an always-on countdown"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

