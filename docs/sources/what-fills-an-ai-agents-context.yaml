  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Allt räknas mot samma gräns. VS Codes dokumentation säger att användarens meddelande, samtalshistoriken, instruktioner, refererade filer och verktygens utdata alla tar plats i kontextfönstret och den definierar fönstret som den största mängd information som en språkmodell kan behandla i en begäran"
    en: "Everything counts against one limit. VS Code's documentation says that the user message, the conversation history, instructions, referenced files and tool outputs all use space in the context window, and it defines the window as the maximum amount of information a language model can process in one request"
