- id: C49
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Tanken handlar om vem som avgör vad som överlever. Vid komprimering skriver verktyget sammanfattningen. Vid en planerad överlämning skriver agenten ner det nästa session behöver medan den ännu kan och koden nämner vad som annars skulle gå förlorat: den medvetna avslutningen"
    en: "The idea is about who decides what survives. In compaction the tool writes the summary. In a planned hand-off the agent writes down what the next session needs while it still can, and the code names what would be lost otherwise: the deliberate wrap-up"
  vendor: Gas City
  url: https://raw.githubusercontent.com/gastownhall/gascity/main/cmd/gc/context_inject.go
  final_url: https://raw.githubusercontent.com/gastownhall/gascity/main/cmd/gc/context_inject.go
  quote: "losing the deliberate wrap-up"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C50
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "De tre nivåerna måste följa modellen. Den 22 och 23 september 2026 begärde Gas City en överlämning vid 160 000 tokens, eftersom den utgick från att fönstret var 200 000. Efter att fabriken satt fönstret till 1 000 000 tokens och överlämningen till 30 % blev det 0,18 överlämningar per bead, fabrikens arbetsenhet, i stället för 1,46, men varje anrop efter den första utåtriktade handlingen bar 187 000 tokens i stället för 142 000"
    en: "The three levels have to follow the model. On 22 and 23 September 2026 Gas City called a hand-off at 160,000 tokens, because it took the window to be 200,000. After the factory set the window to 1,000,000 tokens and the hand-off at 30%, there were 0.18 hand-offs per bead, the factory's unit of work, instead of 1.46, but each call after the first outward action carried 187,000 tokens instead of 142,000"
  vendor: Addable Labs
  url: https://addablelabs.se/blog/what-the-mayors-context-costs/
  final_url: https://addablelabs.se/blog/what-the-mayors-context-costs/
  quote: "called a hand-off at 160,000 tokens"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C51
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "De tre nivåerna måste följa modellen. Den 22 och 23 september 2026 begärde Gas City en överlämning vid 160 000 tokens, eftersom den utgick från att fönstret var 200 000. Efter att fabriken satt fönstret till 1 000 000 tokens och överlämningen till 30 % blev det 0,18 överlämningar per bead, fabrikens arbetsenhet, i stället för 1,46, men varje anrop efter den första utåtriktade handlingen bar 187 000 tokens i stället för 142 000"
    en: "The three levels have to follow the model. On 22 and 23 September 2026 Gas City called a hand-off at 160,000 tokens, because it took the window to be 200,000. After the factory set the window to 1,000,000 tokens and the hand-off at 30%, there were 0.18 hand-offs per bead, the factory's unit of work, instead of 1.46, but each call after the first outward action carried 187,000 tokens instead of 142,000"
  vendor: Addable Labs
  url: https://addablelabs.se/blog/what-the-mayors-context-costs/
  final_url: https://addablelabs.se/blog/what-the-mayors-context-costs/
  quote: "0.18 hand-offs per bead instead of 1.46, but 187,000 tokens per call after the first outward action instead of 142,000"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C52
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "En sen överlämning gör varje anrop längre och en tidig ger fler överlämningar. Det nedskrivna läget måste också vara kort: den 24 september ersattes anteckningarna av ett lägeskort – som skrivs om vid varje överlämning – och en referens som läses i ett anrop, båda trimmade och begränsade"
    en: "A late hand-off makes every call longer and an early one makes more hand-offs. The written state must also stay short: on 24 September the notes were replaced by a state card, rewritten at every hand-off, and a reference read in one call, both trimmed and capped"
  vendor: Addable Labs
  url: https://addablelabs.se/blog/what-the-mayors-context-costs/
  final_url: https://addablelabs.se/blog/what-the-mayors-context-costs/
  quote: "A state card rewritten at every hand-off and a reference read in one call, both trimmed and capped on 24 September"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C53
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Matt Pocock, som publicerar en uppsättning skills för agenter, kommer fram till en liknande tanke från personens sida. I hans regler för fasgränser skriver han att det mitt i en fas inte finns något beslut att fatta: fortsätt, eller dela upp det arbete som återstår på subagenter, eftersom komprimering mitt i en fas får agenten att tappa tråden"
    en: "Matt Pocock, who publishes a set of agent skills, reaches a similar idea from the person's side. In his rules for phase boundaries he writes that mid-phase there is no decision to make: continue, or split the work that is left into subagents, because compacting mid-phase makes the agent lose the thread"
  vendor: Matt Pocock
  url: https://github.com/mattpocock/skills/blob/main/skills/engineering/ask-matt/PHASE-BOUNDARIES.md
  final_url: https://github.com/mattpocock/skills/blob/main/skills/engineering/ask-matt/PHASE-BOUNDARIES.md
  quote: "Mid-phase there is no decision to make: continue, or split the work that's left into subagents. Compacting mid-phase makes the agent lose the thread."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C54
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Vid gränsen ställer han alternativen bredvid varandra: /compact bevarar din avsikt, /clear bevarar ingenting och /handoff bevarar arbetets förmåga att flytta"
    en: "At the boundary he sets the options side by side: /compact preserves your intent, /clear preserves nothing, and /handoff preserves the work's ability to move"
  vendor: Matt Pocock
  url: https://github.com/mattpocock/skills/blob/main/docs/productivity/handoff.md
  final_url: https://github.com/mattpocock/skills/blob/main/docs/productivity/handoff.md
  quote: "`/compact` preserves your intent, `/clear` preserves nothing, `/handoff` preserves the work's ability to move."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C55
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Motvikten kommer från Armin Ronacher: även om subagenter borde bevara kontext bättre får han ofta bättre resultat genom att börja nya sessioner och skriva ner tankar i Markdown-filer. Anthropics guide ger tekniken ett namn, strukturerad anteckning (structured note-taking), där agenten regelbundet skriver anteckningar som sparas utanför kontextfönstret och det är ämnet för artikeln om minne"
    en: "The counterweight comes from Armin Ronacher: although subagents should preserve context better, he often gets better results by starting new sessions and writing thoughts to Markdown files. Anthropic's guide gives the technique a name, structured note-taking, where the agent regularly writes notes persisted outside of the context window, and that is the subject of the article on memory"
  vendor: Armin Ronacher
  url: https://lucumr.pocoo.org/2025/7/30/things-that-didnt-work/
  final_url: https://lucumr.pocoo.org/2025/7/30/things-that-didnt-work/
  quote: "While sub-agents should preserve context better, I often get better results by starting new sessions, writing thoughts to Markdown files"
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C56
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Motvikten kommer från Armin Ronacher: även om subagenter borde bevara kontext bättre får han ofta bättre resultat genom att börja nya sessioner och skriva ner tankar i Markdown-filer. Anthropics guide ger tekniken ett namn, strukturerad anteckning (structured note-taking), där agenten regelbundet skriver anteckningar som sparas utanför kontextfönstret och det är ämnet för artikeln om minne"
    en: "The counterweight comes from Armin Ronacher: although subagents should preserve context better, he often gets better results by starting new sessions and writing thoughts to Markdown files. Anthropic's guide gives the technique a name, structured note-taking, where the agent regularly writes notes persisted outside of the context window, and that is the subject of the article on memory"
  vendor: Anthropic
  url: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
  final_url: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
  quote: "Structured note-taking, or agentic memory, is a technique where the agent regularly writes notes persisted to memory outside of the context window."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C57
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Användare av alla tre verktygen rapporterar samma sorts friktion och det är användarrapporter, inte domar över något enskilt verktyg. I Claude Codes öppna ärendehantering klagar ett ärende på att det inte finns något fungerande sätt att granska samtalshistorik som har rensats eller komprimerats. På Hacker News invänder en kommentator att subagenter inte kan använda cachen och måste läsa om allt, vilket stämmer med Anthropics egen anmärkning att en subagent kan bli långsammare"
    en: "Users of all three tools report the same kinds of friction, and these are user reports, not verdicts on any one tool. On Claude Code's public tracker, one issue complains that there is no working way to review conversation history that has been cleared or compacted. On Hacker News, a commenter objects that subagents cannot use the cache and have to re-read everything, which agrees with Anthropic's own note that a subagent can end up slower"
