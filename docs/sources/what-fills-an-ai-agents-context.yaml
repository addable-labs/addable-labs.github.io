- id: C51
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Efter att fabriken satt fönstret till 1 000 000 tokens och överlämningen till 30 % blev det 0,18 överlämningar per bead, en uppgift i fabrikens ärendehanterare, i stället för 1,46. Anropen efter den första utåtriktade handlingen (till exempel ett svar eller ett utskickat uppdrag) bearbetade däremot i genomsnitt 187 000 tokens i stället för 142 000"
    en: "After the factory set the window to 1,000,000 tokens and the hand-off at 30%, there were 0.18 hand-offs per bead, a task in the factory's tracker, instead of 1.46, but the calls after the first outward action, such as a reply or a dispatch, processed 187,000 tokens on average instead of 142,000"
  vendor: Addable Labs
  url: https://addablelabs.se/blog/what-the-mayors-context-costs/
  final_url: https://addablelabs.se/blog/what-the-mayors-context-costs/
