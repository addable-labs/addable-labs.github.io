- id: C42
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Fabriken bakom den här sajten har ett genomarbetat exempel på samma problem. Dess samordnande agent, borgmästaren, körs i sessioner som var och en slutar med en överlämning: sessionen skriver ner läget i sitt arbete och en ny session fortsätter därifrån"
    en: "The factory behind this site has a worked case of the same problem. Its coordinating agent, the mayor, runs in sessions that each end at a hand-off: the session writes down the state of its work, and a new session continues from there"
