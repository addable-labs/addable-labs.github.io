- id: C06
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Claude Codes dokumentation listar vad som läses in före den första prompten: CLAUDE.md, automatiskt minne, namnen på MCP-verktyg och beskrivningar av skills"
    en: "Claude Code's documentation lists what loads before the first prompt: CLAUDE.md, auto memory, MCP tool names and skill descriptions"
  vendor: Anthropic
  url: https://code.claude.com/docs/en/context-window
  final_url: https://code.claude.com/docs/en/context-window
  quote: "CLAUDE.md, auto memory, MCP tool names, and skill descriptions all load into context."
