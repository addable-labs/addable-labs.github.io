  article: what-fills-an-ai-agents-context
  sentence:
    sv: "En separat kontext är inte en separat plats att arbeta på. VS Codes dokumentation sammanfattar det i en mening: kontextisolering är inte kodisolering. Den skapar inte i sig en separat worktree eller en sandbox, så vad subagenten får röra beror på de behörigheter den körs med, som är ämnet för Sätt gränserna i förväg"
