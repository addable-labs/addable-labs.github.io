- id: C29
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Det som går förlorat är priset. VS Code säger att komprimeringen skapar utrymme för ny information men att detaljer från tidigare meddelanden kan sammanfattas eller utelämnas och Anthropics guide varnar för att alltför aggressiv komprimering kan förlora subtil men avgörande kontext vars betydelse först senare blir uppenbar"
    en: "What is lost is the price. VS Code says that compaction makes room for new information, but that details from earlier messages might be summarised or omitted, and Anthropic's guide warns that overly aggressive compaction can lose subtle but critical context whose importance only becomes apparent later"
  vendor: Microsoft
  url: https://code.visualstudio.com/docs/agents/concepts/context
  final_url: https://code.visualstudio.com/docs/agents/concepts/context
  quote: "Compaction makes room for new information, but details from earlier messages might be summarized or omitted."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

