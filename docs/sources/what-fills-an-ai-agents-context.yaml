- id: C53
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Matt Pocock, som publicerar en uppsättning skills för agenter, kommer fram till en liknande tanke som enskild praktiker. Pococks regler för fasgränser säger att det mitt i en fas inte finns något beslut att fatta: man fortsätter eller delar upp det som återstår på subagenter, eftersom komprimering mitt i en fas får agenten att tappa tråden"
    en: "Matt Pocock, who publishes a set of agent skills, reaches a similar idea as an individual practitioner. Pocock's rules for phase boundaries say that mid-phase there is no decision to make: continue, or split the work that is left into subagents, because compacting mid-phase makes the agent lose the thread"
  vendor: Matt Pocock
  url: https://github.com/mattpocock/skills/blob/main/skills/engineering/ask-matt/PHASE-BOUNDARIES.md
  final_url: https://github.com/mattpocock/skills/blob/main/skills/engineering/ask-matt/PHASE-BOUNDARIES.md
  quote: "Mid-phase there is no decision to make: continue, or split the work that's left into subagents. Compacting mid-phase makes the agent lose the thread."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

- id: C54
  article: what-fills-an-ai-agents-context
  sentence:
    sv: "Pococks anteckningar om överlämningar jämför tre av de fem alternativen vid en fasgräns: /compact bevarar din avsikt, /clear bevarar ingenting och /handoff bevarar möjligheten att flytta arbetet vidare. /handoff är en av Pococks skills och inget inbyggt kommando i verktyget"
    en: "Pocock's notes on hand-offs compare three of the five options at a phase boundary: /compact preserves your intent, /clear preserves nothing and /handoff preserves the work's ability to move. /handoff is one of Pocock's skills, not a command built into the tool"
  vendor: Matt Pocock
  url: https://github.com/mattpocock/skills/blob/main/docs/productivity/handoff.md
  final_url: https://github.com/mattpocock/skills/blob/main/docs/productivity/handoff.md
  quote: "`/compact` preserves your intent, `/clear` preserves nothing, `/handoff` preserves the work's ability to move."
  retrieved: 2026-11-21
  last_checked: 2026-11-21

