  final_url: https://code.visualstudio.com/docs/agents/concepts/context
  quote: "Correcting an answer can guide later responses while that correction remains in context, but doesn't by itself update the trained model or establish memory in other chats."
  retrieved: 2026-11-22
  last_checked: 2026-11-22

