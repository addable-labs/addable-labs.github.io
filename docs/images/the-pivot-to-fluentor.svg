      <stop offset=".55" stop-color="#000" stop-opacity=".7"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="feather" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <mask id="dim-mask" maskUnits="userSpaceOnUse" x="70" y="95" width="320" height="590">
