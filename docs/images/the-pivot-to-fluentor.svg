<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The image of "From self-assessment to AI journey: how Fluentor came about"
       (si-z817, 16 November 2026): the approved Fluentor mark, a torch drawn as
       a map of dots (steps) and curved lines (paths), with one route lit
       inside the flame, from a lower dot up to the top node.
       The mark is the file brand/fluentor-mark.svg (sha256 af0ddbbf...ccd00),
       copied without a change and scaled uniformly: the same nodes, the same
       lines, the same colours, the same positions. The only additions are the
       plate, a soft glow behind the lit nodes, a translucent plate that dims
       the mark a little, and the lit route: the nine lines' own `d`
       attributes drawn again in a brighter stroke. The subject sits inside
       the central 630 x 630 square. -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse" y="15">
      <path d="M0 .5H30M.5 0V30" fill="none" stroke="#242C33"/>
    </pattern>
    <radialGradient id="fade" cx="600" cy="315" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1200" height="630" fill="url(#fade)"/></mask>
    <radialGradient id="node-glow">
      <stop offset="0" stop-color="#FFD36B" stop-opacity=".62"/>
      <stop offset=".42" stop-color="#FFB347" stop-opacity=".24"/>
      <stop offset="1" stop-color="#FF9A2A" stop-opacity="0"/>
