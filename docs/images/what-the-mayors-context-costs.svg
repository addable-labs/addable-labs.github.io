<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The image of "A study of the mayor's context", alternative 1:
       sessions and hand-offs. Each window is one session's context, filled
       call by call from the bottom: the start-up content (grey, sent with
       every call), re-orientation (orange: reading the notes, the calls
       before the first outward action), then the work (green), up to the
       hand-off point (the dashed line). At the hand-off the mayor writes
       down the state of its work (the note) and a new session starts on
       the same floor of start-up content and reads it. Heights follow the
       second period's medians: hand-off at 300,000 tokens, start-up
       content 42,500, re-orientation 31,000. The subject sits inside the
       central 630 x 630 square; nothing that matters is within 40 px of
       an edge. -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse" y="15">
      <path d="M0 .5H30M.5 0V30" fill="none" stroke="#242C33"/>
    </pattern>
    <radialGradient id="fade" cx="600" cy="315" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1200" height="630" fill="url(#fade)"/></mask>
    <radialGradient id="glow" cx="600" cy="315" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#83F35D" stop-opacity=".11"/>
      <stop offset="1" stop-color="#83F35D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0B0E10"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridmask)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- the two sessions' windows -->
  <rect x="318" y="110" width="170" height="398" rx="18" fill="#13181C" stroke="#626E79" stroke-width="3"/>
  <rect x="712" y="110" width="170" height="398" rx="18" fill="#13181C" stroke="#626E79" stroke-width="3"/>
  <!-- the hand-off point -->
  <path d="M330 150H476M724 150H870" stroke="#626E79" stroke-width="2.5" stroke-dasharray="3 9" stroke-linecap="round"/>
  <!-- the start-up content, the floor of every session -->
  <rect x="332" y="445.27" width="142" height="48.73" rx="6" fill="#626E79" fill-opacity=".55"/>
  <rect x="726" y="445.27" width="142" height="48.73" rx="6" fill="#626E79" fill-opacity=".55"/>
  <!-- re-orientation: the calls before the first outward action -->
  <rect x="332" y="425.49" width="142" height="15.77" rx="4" fill="#FF6F00"/>
  <rect x="332" y="405.72" width="142" height="15.77" rx="4" fill="#FF6F00"/>
  <rect x="726" y="425.49" width="142" height="15.77" rx="4" fill="#FF6F00"/>
  <!-- the work, call by call, up to the hand-off -->
  <g fill="#83F35D">
    <rect x="332" y="380.35" width="142" height="21.37" rx="4"/>
    <rect x="332" y="354.98" width="142" height="21.37" rx="4"/>
    <rect x="332" y="329.6" width="142" height="21.37" rx="4"/>
    <rect x="332" y="304.23" width="142" height="21.37" rx="4"/>
    <rect x="332" y="278.86" width="142" height="21.37" rx="4"/>
    <rect x="332" y="253.49" width="142" height="21.37" rx="4"/>
    <rect x="332" y="228.12" width="142" height="21.37" rx="4"/>
    <rect x="332" y="202.74" width="142" height="21.37" rx="4"/>
    <rect x="332" y="177.37" width="142" height="21.37" rx="4"/>
    <rect x="332" y="152" width="142" height="21.37" rx="4"/>
  </g>
  <!-- the hand-off: the note that carries the state of the work -->
  <g fill="none" stroke="#626E79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M500 150H530"/>
    <path d="M654 150H682V433.38H694"/>
  </g>
  <g fill="#626E79">
    <path d="M546 150l-17-8.5v17z"/>
    <path d="M710 433.38l-17-8.5v17z"/>
  </g>
  <rect x="548" y="108" width="104" height="84" rx="12" fill="#1A2126" stroke="#ECEFF1" stroke-width="3"/>
  <g stroke="#A6B0BA" stroke-width="5" stroke-linecap="round">
    <path d="M570 134h60"/>
    <path d="M570 150h48"/>
    <path d="M570 166h30"/>
  </g>
</svg>
