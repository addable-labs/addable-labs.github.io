<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The image of "Cleaning up Gaimer: Tetris and Pong, before and after":
       the article's four games as generic boards, no logos or wordmarks.
       Left, before the cleanup: flat blocks in a plain well with the outline
       of where the piece will land, flat bar paddles and a square ball.
       Right, after: rounded blocks in a framed well clearing a line with
       particles, glowing paddles and a ball that throws off particles where
       it hits. -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse" y="15">
      <path d="M0 .5H30M.5 0V30" fill="none" stroke="#242C33"/>
    </pattern>
    <radialGradient id="fade" cx="600" cy="315" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1200" height="630" fill="url(#fade)"/></mask>
    <radialGradient id="glow" cx="750" cy="315" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#83F35D" stop-opacity=".12"/>
      <stop offset="1" stop-color="#83F35D" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <rect id="flat" width="19" height="19" fill="#626E79"/>
    <rect id="round" x="1" y="1" width="17" height="17" rx="4.5" fill="#83F35D"/>
  </defs>

  <rect width="1200" height="630" fill="#0B0E10"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridmask)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- BEFORE: the falling-block well -->
  <path d="M368 106V332H532V106" fill="none" stroke="#626E79" stroke-width="3"/>
  <g fill="#A6B0BA">
    <rect x="430" y="150" width="19" height="19"/><rect x="450" y="150" width="19" height="19"/><rect x="470" y="150" width="19" height="19"/><rect x="450" y="170" width="19" height="19"/>
  </g>
  <g fill="none" stroke="#A6B0BA" stroke-width="2" stroke-dasharray="4 4">
    <path d="M430.5 230.5H489.5V250.5H469.5V270.5H449.5V250.5H430.5z"/>
  </g>
  <g>
    <use href="#flat" x="370" y="270"/><use href="#flat" x="450" y="270"/><use href="#flat" x="470" y="270"/>
    <use href="#flat" x="370" y="290"/><use href="#flat" x="390" y="290"/><use href="#flat" x="430" y="290"/><use href="#flat" x="450" y="290"/><use href="#flat" x="470" y="290"/><use href="#flat" x="510" y="290"/>
    <use href="#flat" x="370" y="310"/><use href="#flat" x="390" y="310"/><use href="#flat" x="410" y="310"/><use href="#flat" x="430" y="310"/><use href="#flat" x="470" y="310"/><use href="#flat" x="490" y="310"/><use href="#flat" x="510" y="310"/>
  </g>

  <!-- BEFORE: the court -->
  <rect x="330" y="384" width="240" height="140" fill="none" stroke="#626E79" stroke-width="2.5"/>
  <path d="M450 392V518" stroke="#626E79" stroke-width="2.5" stroke-dasharray="8 8"/>
  <rect x="342" y="416" width="8" height="46" fill="#A6B0BA"/>
  <rect x="550" y="440" width="8" height="46" fill="#A6B0BA"/>
  <rect x="486" y="446" width="11" height="11" fill="#ECEFF1"/>

  <!-- before, then after -->
  <path d="M584 315H604" stroke="#626E79" stroke-width="3" stroke-linecap="round"/>
  <path d="M618 315l-16-8v16z" fill="#626E79"/>

  <!-- AFTER: the framed well, a line clearing -->
  <rect x="662" y="100" width="176" height="238" rx="12" fill="#13181C" stroke="#83F35D" stroke-width="2.5"/>
  <rect x="668" y="106" width="164" height="226" rx="8" fill="none" stroke="#242C33" stroke-width="2"/>
  <g filter="url(#soft)">
    <g fill="#A9F78F">
      <rect x="731" y="151" width="17" height="17" rx="4.5"/><rect x="751" y="151" width="17" height="17" rx="4.5"/><rect x="771" y="151" width="17" height="17" rx="4.5"/><rect x="751" y="171" width="17" height="17" rx="4.5"/>
    </g>
    <g>
      <use href="#round" x="670" y="270"/><use href="#round" x="750" y="270"/><use href="#round" x="770" y="270"/>
      <use href="#round" x="670" y="290"/><use href="#round" x="690" y="290"/><use href="#round" x="730" y="290"/><use href="#round" x="750" y="290"/><use href="#round" x="770" y="290"/><use href="#round" x="810" y="290"/>
    </g>
    <rect x="671" y="311" width="158" height="17" rx="4.5" fill="#ECEFF1"/>
  </g>
  <g fill="#A9F78F">
    <rect x="684" y="248" width="6" height="6" rx="1.5"/>
    <rect x="712" y="236" width="5" height="5" rx="1.5"/>
    <rect x="726" y="258" width="4" height="4" rx="1"/>
    <rect x="790" y="244" width="6" height="6" rx="1.5"/>
    <rect x="812" y="232" width="4" height="4" rx="1"/>
    <rect x="804" y="258" width="5" height="5" rx="1.5"/>
    <rect x="700" y="266" width="4" height="4" rx="1"/>
  </g>

  <!-- AFTER: the court, glowing paddles, a ball throwing off particles -->
  <rect x="630" y="384" width="240" height="140" rx="12" fill="#13181C" stroke="#83F35D" stroke-width="2.5"/>
  <path d="M750 394V514" stroke="#242C33" stroke-width="3" stroke-dasharray="8 8"/>
  <g filter="url(#soft)" fill="#83F35D">
    <rect x="642" y="412" width="10" height="52" rx="5"/>
    <rect x="848" y="432" width="10" height="52" rx="5"/>
    <circle cx="828" cy="456" r="7.5" fill="#ECEFF1"/>
  </g>
  <g fill="#ECEFF1">
    <circle cx="812" cy="449" r="5" fill-opacity=".6"/>
    <circle cx="797" cy="443" r="4" fill-opacity=".42"/>
    <circle cx="783" cy="438" r="3" fill-opacity=".28"/>
    <circle cx="770" cy="434" r="2.5" fill-opacity=".16"/>
  </g>
  <g fill="#A9F78F">
    <circle cx="840" cy="440" r="2.5"/>
    <circle cx="834" cy="472" r="2.5"/>
    <circle cx="824" cy="436" r="2"/>
    <circle cx="842" cy="468" r="2"/>
  </g>
</svg>
