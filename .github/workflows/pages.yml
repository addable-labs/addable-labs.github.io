# Build, check and deploy the Addable Labs website (REQ-019, REQ-021).
#
# Pull requests targeting main run the build, every quality gate (pnpm check)
# and the gate tests (pnpm test) and never deploy. Pushes to main, the daily
# schedule and manual dispatches build, check, test, upload _site/ as the Pages
# artifact and deploy it with the official Pages actions — everything but a
# pull request takes the deploying path (`github.event_name != 'pull_request'`
# below). Every action is pinned to a full commit SHA (the tag is in the
# trailing comment); permissions are the minimum each job needs; no secrets
# are referenced — deploy-pages authenticates with the job's OIDC token.
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A static site has no clock: an article dated in the future appears only on
  # the next build, so main is rebuilt and redeployed once a day, early UTC
  # (si-gxyg). Scheduled runs always use the default branch. GitHub disables a
  # cron in a repository with no activity for 60 days; re-enable it from the
  # Actions tab (or run the workflow by hand) if that ever happens.
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC daily, off the hour — GitHub's scheduler is busiest on it
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; a run already in progress is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHECK_REQUIRE_CHROME: "1" # the Chrome-backed gates (lighthouse, layout) may never skip in CI (REQ-024)
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and run every quality gate
        run: pnpm check

      - name: Run the gate tests
        run: pnpm test

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the built site as the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
